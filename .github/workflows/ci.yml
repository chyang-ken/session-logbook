name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional tools (ripgrep, fd) to exercise full search paths
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find

      - name: Byte-compile (syntax check)
        run: python -m compileall server.py sources tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  english-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check tracked files are English-first (CONTRIBUTING.md rule 1)
        run: python3 scripts/check_no_cjk.py
