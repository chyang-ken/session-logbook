<!-- PWA: makes Chrome's "Install app" menu item work -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">

<meta name="apple-mobile-web-app-capable" content="yes">

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('/vendor/fonts/inter-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url('/vendor/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
  }
  :root {
    --bg: #f7f7f5;
    --bg-card: #ffffff;
    --bg-hover: #f2f1ee;
    --border: #e4e4e0;
    --border-light: #eeeee9;

    --text-1: #1a1a1a;
    --text-2: #5a5a57;
    --text-3: #8c8c88;
    --text-4: #b0b0ab;

    --accent: #2f6feb;
    --gold: #d97706;
    --sage: #059669;
    --rust: #dc2626;

    /* Self-hosted typography: Inter / JetBrains Mono are served from /vendor/fonts;
       CJK still falls through to system Simplified Chinese fonts. */
    --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'PingFang SC', 'Noto Sans SC', monospace;

    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-hover: 0 3px 10px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
    --radius: 8px;

    /* Source color contract: Claude warm (apricot cream) / Codex cool (slate gray).
       Avoids --accent (blue, action semantics) / --gold (star semantics) / --rust (destructive semantics).
       chip-bg/fg = list chip + modal header pill;
       glow-1/-2 = the two glow layers of the modal's rectangular light strip (near layer + far layer),
                   radiating outward via box-shadow along the modal rectangle + rounded corners, evoking a "modal floating in a pool of colored light"
                   ambiance. The modal interior is fully white — zero sacrifice to readability. */
    --source-claude-chip-bg: #f1dfbc;
    --source-claude-chip-fg: #7a5520;
    --source-claude-glow-1: rgba(217, 165, 80, 0.50);
    --source-claude-glow-2: rgba(217, 165, 80, 0.22);
    --source-claude-solid: #d9a550;   /* solid emphasis (opaque version of glow): color dot / highlight, more vivid than the chip */

    --source-codex-chip-bg: #c9d6df;
    --source-codex-chip-fg: #3a5566;
    --source-codex-glow-1: rgba(100, 145, 175, 0.50);
    --source-codex-glow-2: rgba(100, 145, 175, 0.22);
    --source-codex-solid: #6491af;    /* same as above: Codex cool-blue solid */

    --source-antigravity-chip-bg: #ddd3f0;
    --source-antigravity-chip-fg: #56438a;
    --source-antigravity-glow-1: rgba(139, 111, 196, 0.50);
    --source-antigravity-glow-2: rgba(139, 111, 196, 0.22);
    --source-antigravity-solid: #8b6fc4;  /* same as above: Antigravity violet solid */

    /* Focus blue ring + search highlight: consolidated in one place to avoid scattered alpha values each written its own way (there was 0.12/0.15, 0.25/0.32 drift). */
    --focus-ring: rgba(47, 111, 235, 0.15);     /* 2px outer ring for input/cell focus */
    --mark-bg: rgba(251, 191, 36, 0.30);        /* search-hit highlight (yellow) — shared by card snippets + conv-find */
    --mark-active-bg: rgba(234, 88, 12, 0.85);  /* conv-find current hit (orange), more vivid than the snippet yellow */

    /* Conversation role colors (shared by card preview .msg-* and conversation view .conv-*).
       Hue stored as an rgb-channel token; alpha written at the point of use via rgba(var(--x-rgb), a), achieving "change the hue in one place and everything follows".
       Deliberately a self-contained palette, separated from the --accent/--gold/--rust semantic colors (see the design-system "conversation role colors" section):
       user = green (same as --sage hue) / assistant = blue (same as --accent hue) / qa = purple / each subtype's text color see -fg. */
    --sage-rgb: 5, 150, 105;             /* = --sage channel (used for note light tint, etc.) */
    --role-user-rgb: 5, 150, 105;        /* = --sage hue (what you said) */
    --role-assistant-rgb: 47, 111, 235;  /* = --accent hue (AI replies) */
    --role-qa-rgb: 139, 92, 246;         /* purple — Q&A / side-branch turns */
    /* Conversation subtype background tint (§1.2: add a token here for a new subtype, don't hardcode rgba in CSS). */
    --role-skill-rgb: 245, 158, 11;      /* orange — skill injection / Q&A Other (external content shares the same orange family) */
    --role-subagent-rgb: 20, 184, 166;   /* cyan — subagent spawn */
    --role-system-rgb: 107, 114, 128;    /* gray — system events */
    /* Role labels / line numbers standardized to neutral gray: the background tint already carries the role identity, so the label no longer repeats the color (single-channel distill). */
    --role-qa-fg: var(--text-2);         /* Q&A role text / line numbers */
    --role-skill-fg: var(--text-2);      /* skill injection label */
    --role-subagent-fg: var(--text-2);   /* subagent label */
    --role-system-fg: #6b7280;           /* system events — gray */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--focus-ring); }

  /* ---------- Header ---------- */
  .page-head {
    position: sticky; top: 0; z-index: 10;
    background: rgba(247, 247, 245, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 28px;
    display: flex; align-items: center; gap: 16px;
  }
  /* Source filter dropdown: replaces the original title, showing the current filter state + ▾.
     Semantics: which side's sessions are currently shown (All/Claude/Codex). */
  .source-filter {
    position: relative;
  }
  .source-filter-trigger {
    display: flex; align-items: center; gap: 5px;
    background: none; border: none;
    padding: 3px 9px; margin-left: -9px;  /* negative margin offsets the padding so the label's left edge aligns with the all state and doesn't jump */
    border-radius: 7px;
    font-size: 15px; font-weight: 700; color: var(--text-1);
    cursor: pointer; user-select: none;
    font-family: var(--font-mono);  /* top-bar filter trigger uses the mono chrome language (consistent with count / recent-days chip) */
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .source-filter-trigger:hover { color: var(--text-1); }
  /* After selecting a specific source: the whole trigger fills into a solid identity badge (apricot gold / slate gray),
     distinguishable at a glance even when collapsed. The All state stays neutral plain text. Hover doesn't flip to gold (it already has an identity color). */
  .source-filter[data-source="claude"] .source-filter-trigger,
  .source-filter[data-source="claude"] .source-filter-trigger:hover {
    background: var(--source-claude-chip-bg);
    color: var(--source-claude-chip-fg);
    box-shadow: inset 0 0 0 1px var(--source-claude-solid);
  }
  .source-filter[data-source="codex"] .source-filter-trigger,
  .source-filter[data-source="codex"] .source-filter-trigger:hover {
    background: var(--source-codex-chip-bg);
    color: var(--source-codex-chip-fg);
    box-shadow: inset 0 0 0 1px var(--source-codex-solid);
  }
  .source-filter[data-source="antigravity"] .source-filter-trigger,
  .source-filter[data-source="antigravity"] .source-filter-trigger:hover {
    background: var(--source-antigravity-chip-bg);
    color: var(--source-antigravity-chip-fg);
    box-shadow: inset 0 0 0 1px var(--source-antigravity-solid);
  }
  /* caret inside the badge follows the identity color (default is --text-3 gray, which looks dirty on a colored background) */
  .source-filter[data-source="claude"] .source-filter-caret,
  .source-filter[data-source="codex"] .source-filter-caret,
  .source-filter[data-source="antigravity"] .source-filter-caret {
    color: currentColor; opacity: 0.65;
  }
  .source-filter-caret {
    font-size: 9px;
    color: var(--text-3);
    transition: transform 0.15s;
  }
  .source-filter[data-open="true"] .source-filter-caret {
    transform: rotate(180deg);
  }
  .source-filter-menu {
    position: absolute; top: 100%; left: 0;
    margin-top: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    min-width: 160px;
    padding: 4px;
    display: none;
    z-index: 20;
  }
  .source-filter[data-open="true"] .source-filter-menu {
    display: block;
  }
  .source-filter-option {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
  }
  .source-filter-option:hover {
    background: var(--bg-hover);
    color: var(--text-1);
  }
  .source-filter-option.active {
    color: var(--text-1);
    font-weight: 600;
  }
  /* Identity color dot: solid and saturated (claude gold / codex blue), same color as the trigger badge's border.
     More vivid than the card chip's light color, distinguishable at a glance in the menu. All = neutral gray. */
  .source-filter-option::before {
    content: "";
    width: 11px; height: 11px; border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-4);
  }
  .source-filter-option[data-value="claude"]::before {
    background: var(--source-claude-solid);
  }
  .source-filter-option[data-value="codex"]::before {
    background: var(--source-codex-solid);
  }
  .source-filter-option[data-value="antigravity"]::before {
    background: var(--source-antigravity-solid);
  }
  /* Selected-state checkmark: moved to the right end, neutral gray (the identity color is already carried by the left color dot) */
  .source-filter-option.active::after {
    content: "✓";
    margin-left: auto;
    padding-left: 12px;
    color: var(--text-3);
    font-weight: 700;
    font-size: 11px;
  }
  .search-wrap {
    position: relative; flex: 1; min-width: 180px;
  }
  .search {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-1);
    font: inherit; font-size: 13px;
    padding: 6px 28px 6px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-4); }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; justify-content: center;
    width: 18px; height: 18px; border: none; border-radius: 50%;
    background: var(--text-4); color: var(--bg); cursor: pointer;
    font-size: 11px; line-height: 1; padding: 0;
  }
  .search-clear:hover { background: var(--text-1); }
  .search-wrap.has-value .search-clear { display: flex; }
  /* Search-in-progress indicator: neutral chrome, reuses --border/--text-3, doesn't occupy a semantic color */
  .search-spinner {
    position: absolute; right: 8px; top: 50%; margin-top: -7px;
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--text-3);
    animation: search-spin 0.6s linear infinite;
    display: none; pointer-events: none;
  }
  .search-wrap.searching .search-spinner { display: block; }
  .search-wrap.searching .search-clear { display: none; }  /* during search the spinner replaces the × */
  @keyframes search-spin { to { transform: rotate(360deg); } }

  /* ===== Icon consolidation: SVG replaces the scattered unicode ✕/×/▾/▸/↑/↓, with uniform size + centering ===== */
  /* Close/clear: ghost close (conv/files/qq/find-clear) flex-centered; the filled-circle clear is already flex */
  .conv-close, .files-close, .qq-close, .conv-find-clear {
    display: inline-flex; align-items: center; justify-content: center;
  }
  .conv-close svg, .files-close svg, .qq-close svg { width: 15px; height: 15px; display: block; }
  .conv-find-clear svg { width: 13px; height: 13px; display: block; }
  .search-clear svg, .files-search-clear svg { width: 11px; height: 11px; display: block; }
  /* Conversation nav up/down: SVG chevron centered */
  .conv-nav-btn { display: inline-flex; align-items: center; justify-content: center; }
  .conv-nav-btn svg { width: 13px; height: 13px; display: block; }
  /* caret (dropdown/collapse indicator): SVG chevron centered, direction controlled by each one's existing rotate rule (rotation logic unchanged) */
  .source-filter-caret, .chip-caret, .conv-export-caret,
  .section-caret, .conv-tool-caret {
    display: inline-flex; align-items: center; justify-content: center;
  }
  .source-filter-caret svg, .chip-caret svg, .conv-export-caret svg,
  .section-caret svg, .caret svg, .conv-tool-caret svg { width: 12px; height: 12px; display: block; }
  .count {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500;
    color: var(--text-3);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .oneshot-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);  /* control label uses the mono chrome language (consistent with the adjacent count) */
    font-size: 12px; color: var(--text-3);
    white-space: nowrap; user-select: none; cursor: pointer;
  }
  .oneshot-toggle input { margin: 0; cursor: pointer; }
  .oneshot-toggle:hover { color: var(--text-1); }
  /* When checked (currently hiding one-shots) the label turns accent, consistent with .files-toggle.on — visually unifying the active state of similar toggles,
     while also hinting that "some sessions are currently hidden". */
  .oneshot-toggle:has(input:checked) { color: var(--accent); }
  .oneshot-toggle:has(input:checked):hover { color: var(--text-1); }
  /* Top-bar icon-only square buttons (collapse all / refresh): flex-centered + square, ensuring the SVG is strictly centered and both buttons are the same size.
     Previously used padding:5px 12px (set for buttons with text) + display:block + inline SVG → icon sat too high, looked crooked. */
  .refresh-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-3);
    cursor: pointer;
    transition: all 0.15s;
  }
  .refresh-btn:hover { color: var(--text-1); border-color: var(--text-3); }
  /* B1 manual refresh: one-rotation feedback */
  .refresh-btn.spinning { animation: refresh-spin 0.6s ease-out; }
  @keyframes refresh-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  /* B1 live heartbeat dot: normally a very faint sage static dot (= dashboard is alive), only "beats" once when data actually changes.
     Turns "the dashboard is watching the fleet for me" from an invisible feature into a trustworthy visible state (the soul of the cockpit). */
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: rgba(var(--sage-rgb), 0.40);
    transition: background 0.4s, box-shadow 0.4s, transform 0.4s;
  }
  .live-dot.beat {
    background: var(--sage);
    box-shadow: 0 0 0 3px rgba(var(--sage-rgb), 0.18);
    transform: scale(1.25);
  }

  /* ---------- Two-column layout ---------- */
  main {
    display: flex;
    gap: 0;
    padding: 20px 28px 60px;
    height: calc(100vh - 49px);
    --col-left-pct: 57.5%;
  }
  .col {
    overflow-y: auto;
    min-width: 0;
  }
  /* the divider itself takes 24px; the left and right columns each yield 12px to preserve the original visual gap */
  .col-left { flex: 0 0 calc(var(--col-left-pct) - 12px); }
  .col-right { flex: 1 1 auto; }

  .col-divider {
    flex: 0 0 24px;
    position: relative;
    cursor: col-resize;
    user-select: none;
  }
  .col-divider::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 16px;
    bottom: 16px;
    width: 1px;
    background: var(--border);
    transform: translateX(-0.5px);
    transition: background 0.15s, width 0.15s;
  }
  .col-divider:hover::before,
  body.col-dragging .col-divider::before {
    background: var(--accent);
    width: 2px;
  }
  body.col-dragging,
  body.col-dragging * {
    cursor: col-resize !important;
    user-select: none !important;
  }

  /* ---------- Section ---------- */
  .section { margin-bottom: 28px; }

  .section-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer; user-select: none;
    transition: border-color 0.2s;
  }
  .section-header:hover { border-bottom-color: var(--text-4); }

  .section-caret {
    color: var(--text-4); font-size: 10px;
    transition: transform 0.2s; width: 12px; flex-shrink: 0;
  }
  .section.open .section-caret { transform: rotate(90deg); color: var(--accent); }

  .section-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex: 1;
  }
  .section-count {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* Recent slice threshold switcher: chip + popover */
  .recent-days-wrap {
    position: relative;
    display: inline-flex;
  }
  .recent-days-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px 2px 9px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--text-3);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .recent-days-chip:hover,
  .recent-days-chip[aria-expanded="true"] {
    color: var(--accent);
    border-color: var(--accent);
  }
  .recent-days-chip .chip-caret {
    font-size: 9px;
    color: var(--text-4);
    transition: transform 0.15s, color 0.15s;
  }
  .recent-days-chip:hover .chip-caret,
  .recent-days-chip[aria-expanded="true"] .chip-caret {
    color: var(--accent);
  }
  .recent-days-chip[aria-expanded="true"] .chip-caret {
    transform: rotate(180deg);
  }
  .recent-days-popover {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 50;
    display: flex; flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    padding: 4px;
    min-width: 96px;
  }
  .recent-days-popover[hidden] { display: none; }
  .recent-days-popover button {
    background: transparent;
    border: none;
    text-align: left;
    padding: 5px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
    color: var(--text-2);
    cursor: pointer;
    border-radius: 3px;
  }
  .recent-days-popover button:hover {
    background: var(--bg-hover);
    color: var(--text-1);
  }
  .recent-days-popover button.active {
    color: var(--accent);
    font-weight: 600;
  }

  /* Export secondary menu (conv-head): trigger = .btn + caret, reusing the recent-days-popover's popup language;
     menu items span two lines (title + description), making the "consumer + artifact" distinction between copy/brief/compact clear. */
  .conv-export-wrap { position: relative; display: inline-flex; }
  .conv-export-caret {
    font-size: 9px; margin-left: 2px; color: var(--text-4);
    transition: transform 0.15s, color 0.15s;
  }
  .conv-export-trigger:hover .conv-export-caret { color: var(--accent); }
  .conv-export-trigger[aria-expanded="true"] .conv-export-caret { transform: rotate(180deg); color: var(--accent); }
  .conv-export-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 50;
    display: flex; flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    padding: 4px;
    min-width: 244px;
  }
  .conv-export-menu[hidden] { display: none; }
  .conv-export-item {
    display: flex; flex-direction: column; gap: 1px;
    background: transparent; border: none; text-align: left;
    padding: 7px 10px; border-radius: 4px; cursor: pointer;
  }
  .conv-export-item:hover { background: var(--bg-hover); }
  .conv-export-item-title {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    color: var(--text-1);
  }
  .conv-export-item-title svg { width: 13px; height: 13px; flex-shrink: 0; }
  .conv-export-item-desc {
    font-size: 11px; line-height: 1.4; color: var(--text-3);
    padding-left: 19px;  /* align with the title text (clearing the icon + gap) */
  }

  .section.dusty .section-title,
  .section.archived .section-title { opacity: 0.6; }
  /* A2 Dusty entry-threshold annotation: surfaces the "N days untouched → sinks to Dusty" rule that was buried in the docs */
  .section-title-note {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
    margin-left: 6px; letter-spacing: 0;
    text-transform: none; font-weight: 400;
  }

  .section-body { padding: 12px 0 0; display: none; }
  .section.open .section-body { display: block; }

  .section-empty {
    font-size: 13px; color: var(--text-4);
    padding: 8px 0; font-style: italic;
  }

  /* ---------- Group ---------- */
  .group { margin-bottom: 20px; }

  .group-header {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 0;
    cursor: pointer; user-select: none;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-3);
    transition: color 0.15s;
  }
  .group-header:hover { color: var(--text-1); }

  .caret {
    color: var(--text-4); font-size: 9px;
    width: 12px; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s; flex-shrink: 0;
  }
  .group.open .caret { transform: rotate(90deg); color: var(--accent); }

  .group-name {
    color: var(--text-1); font-weight: 600; font-size: 14px;
    flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* "No workspace" group: de-emphasized + italic, separating its hierarchy from real project names (no new color introduced, reusing the gray scale) */
  .group-name-nows { color: var(--text-3); font-weight: 500; font-style: italic; }
  .group-header:hover .group-name-nows { color: var(--text-2); }
  .group-count { color: var(--text-4); font-size: 11px; flex-shrink: 0; }
  .group-count::before { content: '· '; opacity: 0.5; }
  .group-paths {
    color: var(--text-4); font-size: 10px; cursor: help;
    flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-dots { color: var(--gold); font-size: 7px; letter-spacing: 2px; flex-shrink: 0; }
  /* group-time and the archive button share the same container, stacked to swap with each other */
  .group-end {
    margin-left: auto; display: grid; align-items: center; flex-shrink: 0;
  }
  .group-time, .group-actions {
    grid-area: 1 / 1; /* same cell, overlaid */
    transition: opacity 0.15s;
  }
  .group-time {
    color: var(--text-4);
    font-size: 11px; font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .group-actions {
    display: flex; gap: 6px; justify-content: flex-end;
    opacity: 0; pointer-events: none;
  }
  /* group header actions: plain-text link style, no outer frame
     font size same as group-header (12px mono) — system rule: inline buttons match the container's font size
     hover switches color by action semantics: files→accent, archive→rust (see docs/design-system.md §2) */
  .group-archive-btn, .group-files-btn {
    font-family: var(--font-mono);
    font-size: 12px; padding: 3px 6px;
    background: none; border: none;
    color: var(--text-4); cursor: pointer;
    transition: color 0.15s;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .group-archive-btn svg, .group-files-btn svg {
    width: 12px; height: 12px; display: block; flex-shrink: 0;
  }
  .group-header:hover .group-time { opacity: 0; pointer-events: none; }
  .group-header:hover .group-actions { opacity: 1; pointer-events: auto; }
  .group-archive-btn:hover { color: var(--rust); }
  .group-files-btn:hover { color: var(--accent); }

  .group-body {
    display: none;
    padding: 8px 0 0 0;
  }
  .group.open .group-body { display: block; }

  /* ---------- Custom-drawn tooltip ----------
     The browser's native title has a forced ~500ms delay and can't appear instantly. Switched to data-tooltip + ::after
     pseudo-element, showing on hover. Just gives the target element a position context (components that already have absolute/relative
     are unaffected; later-defined specific CSS rules will override the relative here).
     text-transform/letter-spacing are both explicitly zeroed to avoid inheriting .btn's uppercase style. */
  [data-tooltip] { position: relative; }
  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    /* Right-aligned: the tooltip's right edge hugs the trigger's right edge, text flows leftward.
       .col's overflow-y:auto makes the browser implicitly clip the X axis too, so with center alignment a trigger on the right side
       always has its tooltip clipped; right-alignment keeps it always inside the container (the trigger itself is in the container).
       For left-side elements (card-sid, etc.) the tooltip is narrower than the trigger, so flowing left won't escape the container. */
    right: 0;
    left: auto;
    padding: 4px 8px;
    background: rgba(20, 20, 20, 0.92);
    color: #fafafa;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    line-height: 1.3;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s ease-out;
    z-index: 100;
  }
  [data-tooltip]:hover::after,
  [data-tooltip]:focus-visible::after { opacity: 1; }
  /* conv-head sits flush against the modal's top, so an upward tooltip gets clipped by the top edge → flip all of them downward within the header */
  .conv-head [data-tooltip]::after { bottom: auto; top: calc(100% + 6px); }

  /* ---------- Card ---------- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    /* leave a left-side gutter for the always-present collapse chevron (separating it from "click card to open details") */
    padding: 14px 16px 12px 34px;
    margin-bottom: 8px;
    position: relative;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--text-4);
  }
  .card.archived { opacity: 0.5; }

  /* A1 source wayfinding: neutral at rest; only on hovering a card does it reveal its source identity glow (very faint glow-2) + border.
     Brings the already-built source glow assets from the modal into the list, solving "in a wall of cards, which side does this belong to". No new colors. */
  .card[data-source="claude"]:hover { box-shadow: 0 4px 14px var(--source-claude-glow-2), var(--shadow); border-color: var(--source-claude-solid); }
  .card[data-source="codex"]:hover { box-shadow: 0 4px 14px var(--source-codex-glow-2), var(--shadow); border-color: var(--source-codex-solid); }
  .card[data-source="antigravity"]:hover { box-shadow: 0 4px 14px var(--source-antigravity-glow-2), var(--shadow); border-color: var(--source-antigravity-solid); }

  /* A3 left/right column register differentiation: the right column (starred/dusty/archived = archive) goes denser,
     pulling away from the left column (recent = main battlefield) so you can tell primary from secondary at a squint. */
  .col-right .card { padding-top: 11px; padding-bottom: 9px; }
  .col-right .msg { padding-top: 3px; padding-bottom: 3px; }

  .card {
    cursor: pointer;
  }
  /* Collapse toggle: persistent in the card's left gutter (not hover-gated) — "this card can be / is collapsed" must be visible at a glance.
     data-act="collapse" makes bindCardEvents short-circuit the whole-card click, only toggling collapse state, not entering detail.
     Neutral chrome semantics (collapse/toggle) → hover switches to --text-1 (see design-system §2). */
  .card-collapse-btn {
    position: absolute; top: 12px; left: 8px;
    width: 20px; height: 20px;
    background: none; border: none; padding: 0;
    color: var(--text-4); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
    z-index: 1;
  }
  .card-collapse-btn:hover { color: var(--text-1); background: var(--bg-hover); }
  .card-collapse-btn svg { width: 14px; height: 14px; display: block; transition: transform 0.15s; }
  /* Collapse button sits against the card's left edge: the default right-aligned tooltip (extending leftward) would overflow the column container's left edge and get clipped,
     so here we switch to left-aligned (extending rightward into the card), overriding the generic [data-tooltip]::after right:0. */
  .card-collapse-btn[data-tooltip]::after { left: 0; right: auto; }
  /* Expanded state: chevron points down (rotated 90°); collapsed state: points right (default 0°) */
  .card:not(.collapsed) .card-collapse-btn svg { transform: rotate(90deg); }

  /* Collapsed state: only show title + foot + first user msg (≤3 lines).
     First = .msgs's first .msg (in long sessions it's the leading first user; in short sessions the ascending tail's first item is also the first user).
     The rest of the recent preview and the note collapse; search match snippets stay (search is a temporary mode — hiding them defeats the search). */
  .card.collapsed .msgs .msg:not(:first-child) { display: none; }
  .card.collapsed .msgs .msg:first-child .msg-text {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card.collapsed .msg-first { border-bottom: none; padding-bottom: 5px; margin-bottom: 0; }
  .card.collapsed .note, .card.collapsed .no-msgs { display: none; }
  /* Top-right Files entry on the card: same level as title, appears only on hover.
     Absolute positioning avoids affecting layout; title adds padding-right so text doesn't slip under the icon.
     right:21px aligns the icon's centerline with the icon centerline of the rightmost .btn in .card-actions
     (= card_right - 32px) — see docs/design-system.md §6.1. */
  .card-files-btn {
    position: absolute; top: 10px; right: 21px;
    width: 22px; height: 22px;
    background: none; border: none; padding: 0;
    color: var(--text-4); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s, color 0.15s, background 0.15s;
    border-radius: 4px;
    z-index: 1;
  }
  .card:hover .card-files-btn { opacity: 1; }
  .card-files-btn:hover { color: var(--accent); background: var(--bg-hover); }
  .card-files-btn svg { width: 14px; height: 14px; display: block; }
  /* Source chip: inlined in card-foot before sid, always shown (not hover-gated).
     Visually CC/CDX are card identity labels, so always visible — unlike the Files button (hover).
     Color contract: Claude warm (apricot cream) / Codex cool (blue-gray), distinguishable at a glance. */
  .source-chip {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono);  /* identity badges use the mono chrome language */
    font-size: 9px; font-weight: 600; letter-spacing: 0.04em;
    padding: 1px 4px; border-radius: 3px;
    line-height: 1.4;
    margin-right: 6px;
    flex-shrink: 0;
    user-select: none;
  }
  .source-chip.source-claude {
    background: var(--source-claude-chip-bg);
    color: var(--source-claude-chip-fg);
  }
  .source-chip.source-codex {
    background: var(--source-codex-chip-bg);
    color: var(--source-codex-chip-fg);
  }
  .source-chip.source-antigravity {
    background: var(--source-antigravity-chip-bg);
    color: var(--source-antigravity-chip-fg);
  }
  /* /title custom title: at the very top of the card, truncated to 2 lines */
  .card-title {
    font-size: 14px; font-weight: 600;
    color: var(--text-1); line-height: 1.35;
    margin-bottom: 6px;
    padding-right: 26px;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  /* worktree suffix on its own row: appears only for worktree sessions; main-repo sessions don't render this element */
  .card-pathrow {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
    min-width: 0;
    padding-right: 26px;
  }
  .card-wtpath {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  /* Time tag: quiet neutral pill. Minimalist — stop_reason no longer hogs every timestamp with a fill color
     (end_turn is the expected default for a normal finish, not worth celebrating on every card; tool_use is neither an error nor warrants misusing star gold).
     "How it ended" is demoted to a hover tooltip for on-demand lookup; at rest, timestamps are uniformly neutral. */
  .time-tag {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(176, 176, 171, 0.20);
    color: var(--text-2);   /* text-3 on the gray tint is only ~2.9:1; bumping to text-2 gives ≈6:1 (10px small text needs ≥4.5) */
    flex-shrink: 0;
  }
  /* Freshness (last 1h) is the only retained peripheral-vision signal: bold + darker, not relying on color. */
  .time-tag.fresh { font-weight: 600; color: var(--text-1); }
  /* D2 "has note" persistent micro-marker: visible even when collapsed, so scanning a column reveals which cards I annotated (not hover-dependent) */
  .card-has-note {
    display: inline-flex; align-items: center; flex-shrink: 0;
    color: var(--sage); margin-left: 2px;
  }
  .card-has-note svg { width: 11px; height: 11px; display: block; }

  /* ---------- Messages ---------- */
  .msgs { padding: 0; font-size: 13px; line-height: 1.55; }
  .msg {
    display: flex; gap: 10px;
    padding: 5px 8px;
    border-radius: 4px;
    margin: 2px -8px;
  }
  /* Minimalist: drop the 3px colored side bar (violates the design-system side-bar ban + double-encodes the same role together with the background color).
     Role distinction is now carried by a single channel: background tint + role-column label. The tint keeps its original value for now; whether to lighten it is decided after verification. */
  .msg-user { background: rgba(var(--role-user-rgb), 0.10); }
  .msg-assistant { background: rgba(var(--role-assistant-rgb), 0.03); }
  .msg-qa { background: rgba(var(--role-qa-rgb),0.08); }
  .msg-role {
    flex: 0 0 52px;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding-top: 3px; white-space: nowrap;
  }
  .msg-user .msg-role { color: var(--text-1); }
  /* D1 the assistant turn's role column was originally an empty span, breaking the left-edge anchor column for you→AI scan-reading.
     Add an aligned, very faint blue dot (using the role-assistant token) to restore a constant anchor column without stealing the show. */
  .msg-assistant .msg-role { color: transparent; position: relative; }
  .msg-assistant .msg-role::before {
    content: ''; position: absolute; top: 7px; left: 0;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(var(--role-assistant-rgb), 0.55);
  }
  .msg-qa .msg-role { color: var(--role-qa-fg); }
  .msg-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .msg-user .msg-text { color: var(--text-1); font-weight: 500; }
  .msg-assistant .msg-text { color: var(--text-2); }
  .msg-qa .msg-text { color: var(--text-1); font-size: 12px; }

  /* First message: keep only the dashed separator (structural line) to distinguish the "starting point" from the recent tail.
     Minimalist — drop the gold "· first" text label (its position already says it's the first one + gold is the star reserved color). */
  .msg-first {
    padding-bottom: 8px; margin-bottom: 4px;
    border-bottom: 1px dashed var(--border);
  }

  .no-msgs { color: var(--text-4); font-size: 12px; padding: 2px 0; }

  /* ---------- Note ----------
     The light theme's own language: sage-hue lightly-tinted surface + sage text, quietly belonging to this card.
     No longer dark-green solid background + white text (the only dark block in the light theme / hardcoded hex escaping tokens / gray text on a colored background). */
  .note {
    margin: 10px -8px 4px;
    padding: 8px 10px;
    background: rgba(var(--sage-rgb), 0.08);
    border-radius: 4px;
    font-size: 13px; color: var(--text-1);
    white-space: pre-wrap;
  }
  .note::before {
    content: 'NOTE · ';
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.1em; color: var(--sage);
    margin-right: 4px;
  }

  /* ---------- Search match snippets ---------- */
  .search-matches {
    margin: 6px -8px 4px;
    padding: 6px 8px;
    background: var(--bg);
    border-radius: 4px;
    font-size: 11px; color: var(--text-3);
    line-height: 1.5;
  }
  .search-matches::before {
    content: 'MATCH · ';
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.1em; color: var(--text-4);
    margin-right: 4px;
  }
  .search-match { margin: 2px 0; }
  .search-match-role {
    font-family: var(--font-mono);
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-4);
    margin-right: 4px;
  }
  .search-match mark {
    background: var(--mark-bg);
    color: var(--text-1);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ---------- Note modal ---------- */
  .note-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .note-dialog {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    padding: 16px;
    width: 360px; max-width: 90vw;
    display: flex; flex-direction: column; gap: 10px;
    font-family: var(--font-mono);
  }
  .note-dialog textarea, .note-dialog button {
    font-family: inherit;
  }
  .note-dialog-title {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-3);
  }
  .note-dialog textarea {
    width: 100%; box-sizing: border-box;
    min-height: 90px; resize: vertical;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px; color: var(--text-1);
    outline: none;
    transition: border-color 0.15s;
  }
  .note-dialog textarea:focus { border-color: var(--accent); }
  .note-dialog-foot {
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .note-dialog-foot .btn-cancel {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 14px;
    font-family: inherit;
    font-size: 12px; color: var(--text-3); cursor: pointer;
    transition: color 0.15s;
  }
  .note-dialog-foot .btn-cancel:hover { color: var(--text-1); }
  .note-dialog-foot .btn-save {
    background: var(--accent); border: none;
    border-radius: 4px; padding: 5px 14px;
    font-family: inherit;
    font-size: 12px; color: #fff; cursor: pointer;
    transition: opacity 0.15s;
  }
  .note-dialog-foot .btn-save:hover { opacity: 0.85; }

  /* ---------- Prompt Queue ---------- */
  /* Reuse the site language: mono caps label + 0.1em tracking, conv-overlay backdrop,
     card-flash feedback animation, --shadow/--radius/--bg-hover tokens */

  /* Pill shape: icon + mono caps label + kbd badge
     Reuse the mono caps tokens of conv-head/note-dialog-title; icon shrinks to 14px so the label dominates recognition.
     Border radius = height/2 = 20px keeps the pill feel; left/right padding is asymmetric (2px tighter on the icon side) for visual centering */
  .qq-fab {
    position: fixed; right: 24px; bottom: 24px;
    height: 40px; padding: 0 14px 0 12px;
    border-radius: 20px;
    background: var(--text-1); color: #fff;
    border: none; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.06);
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    z-index: 90;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .qq-fab:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);
    background: #000;
  }
  .qq-fab:active { transform: translateY(0); }
  .qq-fab svg { width: 14px; height: 14px; display: block; flex-shrink: 0; }
  .qq-fab-label { line-height: 1; }
  .qq-fab-badge {
    position: absolute; top: -3px; right: -3px;
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--gold); color: #fff;
    border-radius: 9px; border: 2px solid var(--bg);
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .qq-fab-badge.show { display: inline-flex; }
  body.standalone .qq-fab { display: none; }

  /* overlay: same 0.18 backdrop + blur(4px) as .conv-overlay
     overflow-y: auto lets the overlay scroll itself — when modal content exceeds the viewport it slides up/down as a whole,
     rather than nesting a scrollbar inside the modal that creates a "top stretched, bottom cramped" illusion */
  .qq-overlay {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 64px 24px;
    overflow-y: auto;
  }
  .qq-overlay.open { display: flex; }
  .qq-modal {
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.08);
    width: min(900px, 100%);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* head: same mono caps label as .conv-head / .note-dialog-title */
  .qq-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .qq-title {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-3);
  }
  .qq-count {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-4);
    letter-spacing: 0.06em;
  }
  .qq-spacer { flex: 1; }
  .qq-close {
    background: none; border: none;
    color: var(--text-3); font-size: 18px; line-height: 1;
    cursor: pointer; padding: 4px 8px;
    border-radius: 4px; transition: all 0.15s;
  }
  .qq-close:hover { background: var(--bg-hover); color: var(--text-1); }

  /* Body: 12-column grid + dense packing, letting each tile span 4/6/8/12 by content length
     to fill gaps like laying tiles; cross-row dragging uses the same before/after semantics.
     Height is determined by content, no longer flex:1 + inner scroll — overflow is taken over by the overlay's whole-page scroll */
  .qq-body {
    padding: 16px 24px 8px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-flow: dense;
    gap: 8px;
    align-content: start;
  }

  /* Empty state: same restraint as the site's .empty — a single line of text-4 copy */
  .qq-empty {
    grid-column: 1 / -1;
    padding: 60px 20px; text-align: center;
    color: var(--text-4); font-size: 14px;
  }

  /* Cell: same tokens as .card — --radius 8px, --shadow, --shadow-hover
     --span is computed by JS from content length (4/6/8/12); grid-auto-flow dense packs automatically */
  .qq-cell {
    --span: 6;
    grid-column: span var(--span);
    display: flex; gap: 0; align-items: stretch;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    position: relative;
    min-width: 0;
  }
  .qq-cell:hover { box-shadow: var(--shadow-hover); }
  .qq-cell:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus-ring), var(--shadow);
  }
  /* While dragging: the source cell is semi-transparent, with pointer-events off so elementFromPoint can pass through to find the cell beneath.
     No longer using drop-left/right markers — instead, splice items directly during dragover for a live make-way preview */
  .qq-cell.dragging { opacity: 0.4; pointer-events: none; }
  /* Drag ghost: a small chip floating with the pointer, giving the cursor a visual anchor for "what am I dragging".
     position fixed + pointer-events none keeps it from interfering with elementFromPoint */
  .qq-drag-ghost {
    position: fixed; z-index: 200;
    pointer-events: none;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.08);
    padding: 8px 12px;
    font-family: var(--font-body);
    font-size: 13px; line-height: 1.45;
    color: var(--text-2);
    max-width: 280px;
    max-height: 64px;
    overflow: hidden;
    white-space: pre-wrap;
    opacity: 0.92;
  }
  .qq-drag-ghost.empty { color: var(--text-4); font-style: italic; }

  /* Copy-success feedback: reuse the same language as .card-flash (accent blue outline + background fade-in) */
  @keyframes qq-cell-flash {
    0%   { box-shadow: 0 0 0 2px var(--accent), var(--shadow); background: rgba(47,111,235,0.10); }
    100% { box-shadow: var(--shadow); background: var(--bg-card); }
  }
  .qq-cell.qq-flash { animation: qq-cell-flash 0.6s ease-out; }

  .qq-drag-handle {
    flex-shrink: 0;
    width: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-4);
    cursor: grab;
    user-select: none;
    transition: color 0.15s, background 0.15s;
  }
  .qq-drag-handle:hover { color: var(--text-2); background: var(--bg-hover); }
  .qq-drag-handle:active { cursor: grabbing; }
  .qq-drag-handle svg { width: 12px; height: 12px; display: block; }

  .qq-cell-ta {
    flex: 1; min-width: 0;
    resize: none; overflow: hidden;
    background: transparent; border: none;
    font-family: var(--font-body);
    font-size: 14px; line-height: 1.55;
    color: var(--text-1);
    padding: 10px 12px; outline: none;
    min-height: 22px;
  }
  .qq-cell-ta::placeholder { color: var(--text-4); }

  /* In-cell buttons: space is precious in the tiled layout, so actions go vertical and show icon only.
     The first one's border-left joins the cell body, the second one's border-top joins the previous one.
     align-items stretch (cross axis, horizontal) makes buttons fill the column width */
  .qq-cell-actions {
    display: flex; flex-direction: column; gap: 0;
    flex-shrink: 0;
    align-items: stretch;
    border-left: 1px solid var(--border);
  }
  /* flex: 1 makes the two buttons split the main axis (vertical) evenly — they grow together to whatever height the cell is,
     and the icon centers within each via the button's own inline-flex + align/justify center */
  .qq-cell-btn {
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    width: 32px; min-height: 32px;
    flex: 1;
    transition: color 0.15s, background 0.15s;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .qq-cell-btn + .qq-cell-btn { border-top: 1px solid var(--border); }
  /* hover follows the color pairing: copy is the primary action → accent blue; delete is destructive → rust red */
  .qq-cell-btn:hover { color: var(--accent); background: var(--bg-hover); }
  .qq-cell-btn.danger:hover { color: var(--rust); }
  .qq-cell-btn svg { width: 13px; height: 13px; display: block; }
  .qq-cell-btn .qq-btn-label { display: none; }

  /* Bottom primary action: mono caps blue fill, matching the .note-dialog-foot .btn-save token style but full-width */
  .qq-foot {
    padding: 8px 24px 16px;
    flex-shrink: 0;
  }
  /* Site-wide restrained ghost/outline language: use a dashed "add" button, hover switches to accent,
     no solid saturated blue block (which was the product's only solid CTA, out of step with the overall tone). */
  .qq-add-btn {
    width: 100%;
    background: none;
    color: var(--text-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.05s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .qq-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--bg-hover); }
  .qq-add-btn:active { transform: translateY(1px); }
  .qq-add-btn svg { width: 12px; height: 12px; display: block; }

  /* ---------- Card meta row (sid + actions + time + dot) ----------
     Merges the former card-header (project/time/dot) with card-foot (sid/actions);
     main-repo sessions are single-line, worktree sessions add an extra .card-wtpath row above.
     actions use margin-left:auto + opacity, appearing on hover; time/dot follow after actions,
     so when idle the actions hold their space invisibly and time/dot stay right-aligned and readable. */
  .card-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 0 0 10px;
  }
  /* card-actions all icon-only: horizontal space is tight (4 buttons after adding files),
     so text sinks into the title attr as a tooltip. padding also tightens to 8/10; the separator is still drawn by .btn+.btn::before.
     The .btn in the conversation-view header is unaffected (it isn't under the .card-actions selector). */
  .card-actions .btn { padding: 8px 10px; }
  .btn.btn-files-inline:hover { color: var(--accent); }
  .card-sid-wrap {
    display: inline-flex; align-items: center; gap: 4px;
    flex: 0 1 auto; min-width: 0; overflow: hidden;
  }
  .card-sid {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
    cursor: pointer;
    transition: color 0.15s;
    white-space: nowrap;
    flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis;
  }
  .card-sid:hover { color: var(--accent); }
  /* Link icon button: copies the jsonl path, matching the .card-sid visual style */
  .sid-link-btn {
    background: none; border: none; padding: 2px;
    color: var(--text-4); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .sid-link-btn:hover { color: var(--accent); }
  .sid-link-btn svg { width: 12px; height: 12px; display: block; }
  .card-actions {
    display: flex; gap: 0;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0; transition: opacity 0.15s;
  }
  .card:hover .card-actions { opacity: 1; }
  .btn {
    background: none; border: none;
    color: var(--text-3);
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; transition: color 0.15s;
    position: relative;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn + .btn::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 1px; height: 10px;
    background: var(--border);
  }
  .btn:hover { color: var(--text-1); }
  .btn-star:hover { color: var(--gold); }
  .btn-star.starred { color: var(--gold); }
  .btn-danger:hover { color: var(--rust); }
  /* Raw toggle active: accent highlight indicates "in raw mode" (like star starred, using a semantic color to show state) */
  .btn.conv-raw-btn.active { color: var(--accent); }
  /* Icon inside the button: 12px, follows currentColor, the star fills when starred */
  .btn-icon { width: 12px; height: 12px; display: block; flex-shrink: 0; }
  .btn-star.starred .btn-icon { fill: currentColor; }

  /* Card flash: a locate cue after an archive action, 0.6s border + background fade-out */
  @keyframes card-flash {
    0%   { box-shadow: 0 0 0 2px var(--accent), var(--shadow); background: rgba(47,111,235,0.10); }
    100% { box-shadow: var(--shadow); background: var(--bg-card); }
  }
  .card.card-flash { animation: card-flash 0.6s ease-out; }

  /* ---------- Detail ---------- */
  .card-detail {
    display: none;
    padding: 8px 10px; margin: 8px 0 0;
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-3);
    line-height: 1.6;
  }
  .card-detail.open { display: block; }
  .card-detail-row { padding: 1px 0; word-break: break-all; }
  .card-detail-label {
    color: var(--text-4); margin-right: 6px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text-1); color: #fff;
    padding: 8px 18px; border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none; opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Toast with an undo action: clickable + inline text/button separation */
  .toast.has-action { pointer-events: auto; display: inline-flex; align-items: center; gap: 12px; }
  .toast-action {
    background: none; border: none; padding: 0;
    color: color-mix(in srgb, var(--accent) 55%, white); cursor: pointer;
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .toast-action:hover { text-decoration: underline; }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-4); font-size: 14px;
  }
  /* C3 empty-state variant: title + a one-line way out (not a dead end), using existing tokens, zero illustration, doesn't break the restraint */
  .empty-title { color: var(--text-2); font-size: 14px; margin-bottom: 6px; }
  .empty-hint { color: var(--text-4); font-size: 12px; line-height: 1.6; }
  .empty-action {
    margin-top: 12px;
    background: none; border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 6px 14px;
    color: var(--text-2); cursor: pointer;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .empty-action:hover { color: var(--accent); border-color: var(--accent); background: var(--bg-hover); }
  /* C3 skeleton placeholder (conversation/Files loading): grey-bar shimmer, conveys "working" better than a blank-screen spinner, and pre-reserves layout to reduce CLS */
  .skeleton-line {
    height: 13px; border-radius: 4px; margin: 12px 0;
    background: linear-gradient(90deg, var(--border-light) 25%, var(--bg-hover) 50%, var(--border-light) 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.2s ease-in-out infinite;
  }
  @keyframes skeleton-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .conv-skeleton { padding: 20px 24px; max-width: 820px; }

  /* ---------- Conversation Modal ---------- */
  .conv-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  .conv-overlay.open { display: flex; }

  .conv-modal {
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.08);
    width: 92vw; max-width: 1200px; height: 90vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Source glow strip: the backdrop stays its original dark, the modal itself glows outward via box-shadow along its rectangle + rounded corners.
     Two-layer glow: inner layer 120px blur + 8px spread (the colored light hugging the modal edge),
              outer layer 260px blur + 30px spread (the distant ambient halo),
     creating the look of the "modal floating in a pool of colored light"; unlike a radial-gradient elliptical halo, this follows the modal's rectangular rounded corners.
     `backdrop-filter: blur(4px)` is kept; the glow becomes softer after the blur.
     The modal interior is fully white, zero sacrifice to readability. */
  .conv-overlay[data-source="claude"],
  .conv-overlay[data-source="codex"],
  .conv-overlay[data-source="antigravity"] {
    background: rgba(0, 0, 0, 0.22);
  }
  .conv-overlay[data-source="claude"] .conv-modal {
    box-shadow:
      0 20px 60px rgba(0,0,0,0.15),
      0 4px 16px rgba(0,0,0,0.08),
      0 0 120px 8px var(--source-claude-glow-1),
      0 0 260px 30px var(--source-claude-glow-2);
  }
  .conv-overlay[data-source="codex"] .conv-modal {
    box-shadow:
      0 20px 60px rgba(0,0,0,0.15),
      0 4px 16px rgba(0,0,0,0.08),
      0 0 120px 8px var(--source-codex-glow-1),
      0 0 260px 30px var(--source-codex-glow-2);
  }
  .conv-overlay[data-source="antigravity"] .conv-modal {
    box-shadow:
      0 20px 60px rgba(0,0,0,0.15),
      0 4px 16px rgba(0,0,0,0.08),
      0 0 120px 8px var(--source-antigravity-glow-1),
      0 0 260px 30px var(--source-antigravity-glow-2);
  }

  .conv-head {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0;
  }
  .conv-head-top { display: flex; align-items: center; gap: 12px; }
  .conv-info { flex: 1; min-width: 0; }
  /* Source pill: the identity label in the modal header, on the same line as conv-title.
     Reuses the mono-caps token from conv-detail / note-dialog-title, but with a chip background color——
     the list chip is an abbreviation (CC/CDX); here it expands to the full name (CLAUDE CODE / CODEX) to make the modal's first screen clearer.
     color follows the source (warm/cool), fully orthogonal to the body accent / role colors. */
  .conv-title-row {
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .conv-source-pill {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    user-select: none;
    line-height: 1.4;
  }
  .conv-source-pill.source-claude {
    background: var(--source-claude-chip-bg);
    color: var(--source-claude-chip-fg);
  }
  .conv-source-pill.source-codex {
    background: var(--source-codex-chip-bg);
    color: var(--source-codex-chip-fg);
  }
  .conv-source-pill.source-antigravity {
    background: var(--source-antigravity-chip-bg);
    color: var(--source-antigravity-chip-fg);
  }
  .conv-title {
    font-size: 14px; font-weight: 600; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 1;
  }
  /* When a /title is present, project_path drops to the subtitle, single-line truncated */
  .conv-subtitle {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }
  .conv-meta {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  }
  .conv-actions {
    display: flex; gap: 0; flex-shrink: 0;
  }
  .conv-popout, .conv-share {
    background: none; border: none;
    color: var(--text-3); line-height: 1;
    cursor: pointer; padding: 4px 8px;
    border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .conv-popout svg, .conv-share svg { width: 16px; height: 16px; display: block; }
  .conv-popout:hover, .conv-share:hover { background: var(--bg-hover); color: var(--accent); }
  .conv-close {
    background: none; border: none;
    color: var(--text-3); font-size: 18px; line-height: 1;
    cursor: pointer; padding: 4px 8px;
    border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
  }
  .conv-close:hover { background: var(--bg-hover); color: var(--text-1); }

  /* User-msg navigator */
  .conv-head-nav {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3);
  }
  .conv-nav-btn {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 8px;
    font-family: inherit; font-size: 12px; color: var(--text-2);
    cursor: pointer; transition: all 0.12s;
    line-height: 1.2;
  }
  .conv-nav-btn:hover:not(:disabled) {
    color: var(--text-1); border-color: var(--text-3);
    background: var(--bg-hover);
  }
  .conv-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .conv-nav-pos {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-2); min-width: 54px; text-align: center;
    padding: 0 4px;
  }
  .conv-nav-pos .cur { color: var(--text-1); font-weight: 600; }
  .conv-nav-pos .tot { color: var(--text-3); }
  .conv-nav-sep { color: var(--text-4); }
  .conv-nav-goto-label {
    color: var(--text-3); margin-left: 4px;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px;
  }
  .conv-nav-goto {
    width: 56px; padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-mono); font-size: 11px;
    background: var(--bg-card); color: var(--text-1);
    -moz-appearance: textfield;
  }
  .conv-nav-goto::-webkit-outer-spin-button,
  .conv-nav-goto::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .conv-nav-goto:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus-ring);
  }
  .conv-hint {
    margin-left: auto;
    font-size: 10px; color: var(--text-4);
    letter-spacing: 0.04em;
  }
  .conv-user.active {
    box-shadow: 0 0 0 2px rgba(var(--role-user-rgb), 0.55);
    background: rgba(var(--role-user-rgb), 0.16);
  }

  /* ---------- Conv internal find (full-text search within the modal) ---------- */
  .conv-head-find {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3);
  }
  .conv-find-label {
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px;
    color: var(--text-3);
  }
  .conv-find-input {
    flex: 0 1 260px; min-width: 140px;
    padding: 2px 8px;
    border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-mono); font-size: 11px;
    background: var(--bg-card); color: var(--text-1);
  }
  .conv-find-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus-ring);
  }
  .conv-find-pos {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-2); min-width: 48px; text-align: center;
    padding: 0 4px;
  }
  .conv-find-pos .cur { color: var(--text-1); font-weight: 600; }
  .conv-find-pos .tot { color: var(--text-3); }
  .conv-find-clear {
    background: transparent; border: none;
    color: var(--text-4); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 4px;
    transition: color 0.12s;
  }
  .conv-find-clear:hover { color: var(--text-1); }
  .conv-find-scope {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: 6px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .conv-find-scope-opt {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3);
    cursor: pointer;
    user-select: none;
  }
  .conv-find-scope-opt input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  .conv-find-scope-opt:hover { color: var(--text-1); }
  .conv-find-hint {
    margin-left: auto;
    font-size: 10px; color: var(--text-4);
    letter-spacing: 0.04em;
  }
  .conv-body mark.conv-find {
    background: var(--mark-bg);
    color: var(--text-1);
    border-radius: 2px;
    padding: 0 1px;
  }
  .conv-body mark.conv-find.conv-find-active {
    background: var(--mark-active-bg);
    color: #fff;
    box-shadow: 0 0 0 1px rgba(234, 88, 12, 0.6);
  }

  /* ---------- Recent files modal ---------- */
  .files-overlay {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
  }
  .files-overlay.open { display: flex; }
  .files-modal {
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 4px 16px rgba(0,0,0,0.08);
    width: 88vw; max-width: 820px; height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .files-head {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .files-title {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 600; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .files-root {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 2px;
  }
  .files-meta {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-4);
    letter-spacing: 0.04em; flex-shrink: 0;
  }
  .files-meta .dot { color: var(--accent); margin-right: 4px; }
  .files-close {
    background: none; border: none;
    color: var(--text-3); font-size: 18px; line-height: 1;
    cursor: pointer; padding: 4px 8px;
    border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
  }
  .files-close:hover { background: var(--bg-hover); color: var(--text-1); }
  .files-tabs {
    display: flex; gap: 2px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .files-tab {
    padding: 8px 12px 6px;
    font-size: 12px; font-family: var(--font-mono);
    color: var(--text-3);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer; white-space: nowrap;
    transition: color 0.12s, border-color 0.12s;
    margin-bottom: -1px;  /* overlaps the bottom edge of .files-tabs */
  }
  .files-tab:hover { color: var(--text-1); }
  .files-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .files-tab .tab-kind {
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-4); margin-right: 4px;
  }
  .files-tab.active .tab-kind { color: var(--accent); opacity: 0.7; }
  /* ignored toggle: top-right of the modal header, refreshes the file list after toggling */
  .files-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-3); cursor: pointer;
    user-select: none;
    padding: 2px 6px; border-radius: 3px;
    margin-right: 6px;
  }
  .files-toggle:hover { background: var(--bg-hover); color: var(--text-1); }
  .files-toggle input { margin: 0; cursor: pointer; }
  .files-toggle.on { color: var(--accent); }
  /* folder filename search bar: same modal as Recent files; typing switches to "whole-tree fd lookup",
     clearing returns to the recently-modified list. Style aligned with the dashboard's top .search. */
  .files-search-wrap {
    position: relative; flex-shrink: 0;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
  }
  .files-search {
    width: 100%; box-sizing: border-box;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-1);
    font: inherit; font-size: 13px;
    padding: 6px 30px 6px 12px;
    outline: none;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .files-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus-ring);
  }
  .files-search::placeholder { color: var(--text-4); }
  .files-search-clear {
    position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; justify-content: center;
    background: var(--text-4); color: var(--bg);
    border: none; border-radius: 50%;
    width: 16px; height: 16px; line-height: 1;
    font-size: 12px; cursor: pointer; padding: 0;
  }
  .files-search-clear:hover { background: var(--text-1); }
  .files-search-wrap.has-value .files-search-clear { display: flex; }
  .files-body {
    flex: 1; overflow-y: auto;
    padding: 4px 0;
  }
  /* The file list takes on the OS-native file browser tone (Finder / GitHub / Linear all use sans):
     path text uses system sans, opening a semantic distance from the dashboard's main tone (mono);
     the git status letter + time + size keep mono (code-status / number-alignment semantics). */
  .file-row {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 20px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s, border-color 0.1s;
    line-height: 1.45;
  }
  .file-row:hover {
    background: var(--bg-hover);
    border-left-color: var(--accent);
  }
  /* per-file git status marker: leftmost 22px column, single-letter / `?` colored */
  .file-status {
    display: inline-block; width: 22px;
    font-family: var(--font-mono); font-size: 10px;
    font-weight: 600; text-align: center;
    flex-shrink: 0;
    color: var(--text-4);
  }
  .file-status.s-M { color: var(--gold); }
  .file-status.s-A { color: var(--sage); }
  .file-status.s-D { color: var(--rust); }
  .file-status.s-R { color: var(--accent); }
  .file-status.s-Q { color: var(--text-3); }  /* untracked, shows ? */
  .file-rel {
    flex: 1; min-width: 0;
    font-family: var(--font-body);
    font-size: 13px;
    letter-spacing: -0.005em;
    color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .file-rel .file-dir { color: var(--text-4); font-weight: 400; }
  .file-rel .file-name { color: var(--text-1); font-weight: 500; }
  .file-time {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3); font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 60px; text-align: right;
  }
  .file-size {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-4); font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 56px; text-align: right;
  }
  /* The two action buttons that only appear on file-row hover: copy absolute path / reveal in Finder
     absolute-positioned against the right side of the row, covering time/size, without crowding inline space.
     Visually aligned with the .btn system (mono / uppercase / letter-spacing) but tightened to row height. */
  .file-actions {
    position: absolute;
    right: 16px; top: 0; bottom: 0;
    display: flex; align-items: center; gap: 4px;
    padding-left: 48px;
    background: linear-gradient(to right, transparent 0, var(--bg-hover) 24px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.1s;
  }
  .file-row:hover .file-actions { opacity: 1; pointer-events: auto; }
  .file-action-btn {
    background: none; border: none;
    padding: 3px 6px;
    color: var(--text-3); cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color 0.15s;
  }
  .file-action-btn:hover { color: var(--accent); }
  .file-action-btn svg { width: 11px; height: 11px; display: block; flex-shrink: 0; }
  .files-empty {
    padding: 60px 20px; text-align: center;
    color: var(--text-4); font-size: 13px;
  }
  .files-retry {
    background: none; border: none; padding: 0;
    color: var(--accent); cursor: pointer; font: inherit;
  }
  .files-retry:hover { text-decoration: underline; }

  /* Standalone mode (?session=<id>): full-page conversation */
  body.standalone .page-head,
  body.standalone main,
  body.standalone .toast { display: none !important; }
  body.standalone .conv-overlay {
    position: static; background: transparent; backdrop-filter: none;
    width: 100%; min-height: 100vh;
  }
  body.standalone .conv-modal {
    width: 100%; max-width: none; height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  body.standalone .conv-close,
  body.standalone .conv-popout { display: none; }
  /* Standalone: body font size bumped up by about 2px overall, more comfortable for long reading */
  body.standalone .conv-text { font-size: 15px; line-height: 1.7; }
  body.standalone .conv-text.md h1 { font-size: 18px; }
  body.standalone .conv-text.md h2 { font-size: 16px; }
  body.standalone .conv-text.md h3 { font-size: 15px; }
  body.standalone .conv-text.md code { font-size: 13px; }
  body.standalone .conv-text.md pre code { font-size: 14px; }
  body.standalone .conv-text.md table { font-size: 14px; }
  body.standalone .conv-skill .conv-text { font-size: 14px; }
  body.standalone .conv-tool-head { font-size: 14px; }
  body.standalone .conv-tool-body { font-size: 13px; }

  .conv-body {
    flex: 1; overflow-y: auto;
    padding: 16px 24px 40px;
  }

  /* conv-detail: serves as the last line of conv-head (ID/size/mtime/jsonl_path), stays sticky and doesn't scroll away
     conv-head already has its own border-bottom, so no need to redraw the bottom edge here */
  .conv-detail {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
    line-height: 1.7;
    padding-top: 2px;
  }
  .conv-detail span { margin-right: 16px; }
  /* session id row: same style as the card's .card-sid-wrap —— the id text itself is click-to-copy (no separate button),
     icon button is borderless ghost. No more bordered "copy" pill / bordered icon (violates the no-border rule in design-system §7,
     and would diverge from the card version). Same component stays consistent across surfaces. */
  .conv-sid-wrap { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; }
  .conv-detail .conv-copy-id {
    margin: 0;
    font-family: var(--font-mono);
    color: var(--text-4); cursor: pointer;
    transition: color 0.15s;
  }
  .conv-copy-id:hover { color: var(--accent); }
  /* link icon button inside conv-detail: copy jsonl path —— borderless ghost, aligned with the card's .sid-link-btn */
  .conv-link-btn {
    background: none; border: none; padding: 2px; margin: 0;
    color: var(--text-4); cursor: pointer;
    transition: color 0.15s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .conv-link-btn:hover { color: var(--accent); }
  .conv-link-btn svg { width: 12px; height: 12px; display: block; }

  /* Turn */
  .conv-turn {
    padding: 10px 14px; border-radius: 6px; margin-bottom: 6px;
  }
  /* Simplification: drop the 3px side bar; role is carried by the background tint + role label on a single channel (see .msg-user) */
  .conv-user { background: rgba(var(--role-user-rgb), 0.10); }
  .conv-assistant { background: rgba(var(--role-assistant-rgb), 0.03); }
  .conv-turn-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .conv-role {
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .conv-ts {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-4);
    margin-left: auto; opacity: 0; transition: opacity 0.15s;
  }
  .conv-turn:hover .conv-ts { opacity: 1; }

  .conv-skill { background: rgba(var(--role-skill-rgb), 0.07); }
  .conv-skill .conv-role { color: var(--role-skill-fg); }
  .conv-skill .conv-text { color: var(--text-3); font-size: 12px; }
  .conv-user .conv-role { color: var(--text-1); }

  /* Subagent spawn — the inline signal at the moment "the main agent dispatches a subagent" (phase one doesn't expand the content)
     Visually distinguished from skill: uses cyan to avoid skill (orange) / qa (purple) / user/assistant (grey) */
  .conv-subagent-spawn {
    background: rgba(var(--role-subagent-rgb), 0.06);
    padding: 10px 14px;
    margin: 6px 0;
    border-radius: 4px;
  }
  .conv-subagent-spawn .spawn-line {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 13px; color: var(--text-2);
  }
  .conv-subagent-spawn .spawn-icon { font-size: 14px; line-height: 1; }
  .conv-subagent-spawn .spawn-name {
    font-weight: 600; color: var(--role-subagent-fg);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .conv-subagent-spawn .conv-ts {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
  }
  .conv-subagent-spawn .spawn-desc {
    margin-top: 6px; margin-left: 22px;
    color: var(--text-3); font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  /* System events — pseudo-messages the harness injects under the user role (task notification / bash output / teammate).
     Visually they must clearly differ from real user input (green) and assistant replies (blue), shown compactly in a low-saturation grey single line.
     Semantically they belong to the assistant/system side; search filtering buckets them with assistant. */
  .conv-system-event {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 14px;
    margin: 3px 0;
    background: rgba(var(--role-system-rgb), 0.05);
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-3);
  }
  .conv-system-event .sysev-icon { font-size: 13px; line-height: 1; flex-shrink: 0; }
  .conv-system-event .sysev-role {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--role-system-fg);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .conv-system-event .sysev-text {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .conv-system-event .conv-ts {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px; color: var(--text-4);
    flex-shrink: 0;
  }
  /* Simplification: system-event subtypes are no longer distinguished by left-bar color (the side bar is gone)—identified by sysev-icon + role label. */
