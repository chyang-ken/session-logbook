function renderConv(data, meta) {
  const head = $conv.querySelector('.conv-head');
  const body = $conv.querySelector('.conv-body');
  // Set data-source so the overlay switches the source glow (radial gradient around the modal)
  // meta may be empty (standalone cold start); fall back to data.source, then to claude
  const _src = (meta?.source || data.source || 'claude');
  $conv.setAttribute('data-source', ['codex', 'antigravity'].includes(_src) ? _src : 'claude');

  const userCount = data.turns.filter(t => t.type === 'user').length;
  const toolTurns = data.turns.filter(t => t.type === 'tool').length;
  const hasMeta = !!meta;
  const starLabel = meta?.starred ? 'unstar' : 'star';
  const archiveLabel = meta?.archived ? 'unarchive' : 'archive';
  const archiveClass = meta?.archived ? '' : 'btn-danger';
  const archiveIcon = meta?.archived ? ICONS.unarchive : ICONS.archive;
  // Raw toggle: shown in all modes (including standalone), independent of meta. Highlighted accent when active.
  const rawBtnHtml = `<button class="btn conv-raw-btn ${_convRaw ? 'active' : ''}" id="conv-raw" aria-pressed="${_convRaw}" data-tooltip="${_convRaw ? 'Showing raw text in this view — click for rendered markdown' : 'Show raw text for this view'}">${ICONS.code}${_convRaw ? 'raw on' : 'raw'}</button>`;
  // Export submenu: three export actions (shown in all modes, independent of meta) collected into one menu.
  // Naming/descriptions deliberately spell out "artifact + consumer" — we once used the three abbreviations export/brief/compact side by side and even kept confusing them:
  //   · Copy as Markdown   = copy the full MD for people to read (token-optimized transcript, see docs/decisions/2026-05-11-export-format.md)
  //   · Copy with AI summary = copy + a brief header generated locally by claude -p, ~10-15s
  //   · Download for an agent = download a reduced transcript with [L#] original line-number anchors, so another agent can expand back to the source on demand
  //     (this is a different reduction for a different consumer than the "copy for people to read"; see docs/philosophy.md "context reduction (for whom)";
  //      uses browser download, and the dual-source backend /anchored auto-routes by source between Claude / Codex)
  const exportMenuHtml = `<div class="conv-export-wrap">
      <button class="btn conv-export-trigger" id="conv-export-trigger" aria-haspopup="true" aria-expanded="false" data-tooltip="Export this conversation">${ICONS.download}export<span class="conv-export-caret">${ICONS.chevronDown}</span></button>
      <div class="conv-export-menu" id="conv-export-menu" role="menu" hidden>
        <button class="conv-export-item" id="conv-export-copy" role="menuitem">
          <span class="conv-export-item-title">${ICONS.download}Copy as Markdown</span>
          <span class="conv-export-item-desc">Full transcript to clipboard — for reading</span>
        </button>
        <button class="conv-export-item" id="conv-export-brief" role="menuitem">
          <span class="conv-export-item-title">${ICONS.zap}Copy with AI summary</span>
          <span class="conv-export-item-desc">Prepends an AI-written brief · ~10–15s</span>
        </button>
        <button class="conv-export-item" id="conv-export-anchored" role="menuitem">
          <span class="conv-export-item-title">${ICONS.compress}Download for an agent</span>
          <span class="conv-export-item-desc">Line-anchored file an agent can re-read</span>
        </button>
      </div>
    </div>`;
  const metaBtnsHtml = hasMeta ? `
      <button class="btn btn-star ${meta?.starred ? 'starred' : ''}" id="conv-star" data-tooltip="${meta?.starred ? 'Unstar' : 'Star'}">${ICONS.star}${starLabel}</button>
      <button class="btn ${archiveClass}" id="conv-archive" data-tooltip="${meta?.archived ? 'Unarchive' : 'Archive'}">${archiveIcon}${archiveLabel}</button>` : '';
  const actionsHtml = `
    <div class="conv-actions">
      ${rawBtnHtml}${exportMenuHtml}${metaBtnsHtml}
    </div>`;
  const popoutHtml = _convStandalone ? '' :
    `<button class="conv-popout" id="conv-popout" data-tooltip="Open in new tab" aria-label="Open in new tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></button>`;
  // Share button: shown in both modes (in standalone the popout is hidden, but copying the URL from the address bar is annoying, so we keep this)
  const shareHtml =
    `<button class="conv-share" id="conv-share" data-tooltip="Copy link to this session" aria-label="Copy link to this session">${ICONS.share}</button>`;
  const closeHtml = _convStandalone ? '' :
    `<button class="conv-close" id="conv-close">${ICONS.close}</button>`;

  // /title custom title takes priority; otherwise fall back to project_path / id
  const headTitle = data.custom_title || data.project_path || data.id;
  const subtitleHtml = data.custom_title && data.project_path
    ? `<div class="conv-subtitle" title="${escapeHtml(data.project_path)}">${escapeHtml(data.project_path)}</div>`
    : '';
  // Source pill: modal identity tag, on the same line as conv-title
  const sourceVal = (meta?.source || data.source || 'claude');
  const SRC_PILL = {
    codex: ['Codex', 'source-codex'],
    antigravity: ['Antigravity', 'source-antigravity'],
  };
  const [sourceLabel, sourceClass] = SRC_PILL[sourceVal] || ['Claude Code', 'source-claude'];
  const sourcePillHtml = `<span class="conv-source-pill ${sourceClass}" title="${sourceLabel} session">${sourceLabel}</span>`;
  // Metadata row (ID + size + mtime + jsonl_path) — placed in head as the sticky last line
  // Historically this section sat at the top of body and scrolled away with the turns, so the user lost sight of the ID once scrolled into the middle
  const sizeKB = meta ? (meta.size / 1024).toFixed(1) + ' KB' : '';
  const pathBtnHtml = meta?.jsonl_path
    ? `<button class="conv-link-btn" data-copy-path="${escapeHtml(meta.jsonl_path)}" data-tooltip="Copy JSONL path" aria-label="Copy JSONL path">${ICONS.link}</button>`
    : '';
  const detailHtml = `
    <div class="conv-detail">
      <span class="conv-sid-wrap"><span class="conv-copy-id" data-copy-id="${escapeHtml(data.id)}" data-tooltip="Click to copy session ID">${escapeHtml(data.id)}</span>${pathBtnHtml}</span>
      ${sizeKB ? `<span>${sizeKB}</span>` : ''}
      ${meta?.mtime_iso ? `<span>${escapeHtml(fmtAbsTime(meta.mtime_iso))}</span>` : ''}
      ${meta?.jsonl_path ? `<div style="margin-top:2px">${escapeHtml(meta.jsonl_path)}</div>` : ''}
    </div>`;

  head.innerHTML = `
    <div class="conv-head-top">
      <div class="conv-info">
        <div class="conv-title-row">
          ${sourcePillHtml}
          <div class="conv-title" title="${escapeHtml(headTitle)}">${escapeHtml(headTitle)}</div>
        </div>
        ${subtitleHtml}
        <div class="conv-meta">${userCount} msgs · ${toolTurns} tool calls · ${data.total_lines} raw lines</div>
      </div>
      ${actionsHtml}
      ${shareHtml}
      ${popoutHtml}
      ${closeHtml}
    </div>
    <div class="conv-head-nav">
      <button class="conv-nav-btn" id="conv-prev" data-tooltip="Prev user msg (k)">${ICONS.chevronUp}</button>
      <span class="conv-nav-pos"><span class="cur">—</span><span class="conv-nav-sep">/</span><span class="tot">—</span></span>
      <button class="conv-nav-btn" id="conv-next" data-tooltip="Next user msg (j)">${ICONS.chevronDown}</button>
      <span class="conv-nav-goto-label">go to</span>
      <input class="conv-nav-goto" id="conv-goto" type="number" min="1" max="${userCount}" placeholder="#">
      <button class="conv-nav-btn" id="conv-latest" data-tooltip="Jump to latest message">latest</button>
      <span class="conv-hint">k/j prev/next</span>
    </div>
    <div class="conv-head-find">
      <span class="conv-find-label">find</span>
      <input class="conv-find-input" id="conv-find" type="text" placeholder="Search this conversation…" autocomplete="off" spellcheck="false">
      <span class="conv-find-pos"><span class="cur">0</span><span class="conv-nav-sep">/</span><span class="tot">0</span></span>
      <button class="conv-nav-btn" id="conv-find-prev" data-tooltip="Prev match (Shift+Enter)" disabled>${ICONS.chevronUp}</button>
      <button class="conv-nav-btn" id="conv-find-next" data-tooltip="Next match (Enter)" disabled>${ICONS.chevronDown}</button>
      <button class="conv-find-clear" id="conv-find-clear" data-tooltip="Clear (Esc)" aria-label="Clear search">${ICONS.close}</button>
      <span class="conv-find-scope" title="Show only these message types (also restricts find scope)">
        <label class="conv-find-scope-opt"><input type="checkbox" id="conv-find-scope-user" checked> user</label>
        <label class="conv-find-scope-opt"><input type="checkbox" id="conv-find-scope-assistant" checked> assistant</label>
      </span>
      <span class="conv-find-hint">Enter next · Shift+Enter prev</span>
    </div>
    ${detailHtml}`;

  if (!_convStandalone) {
    head.querySelector('#conv-close').addEventListener('click', closeConversation);
    head.querySelector('#conv-popout').addEventListener('click', () => {
      window.open(`/?session=${encodeURIComponent(data.id)}`, '_blank', 'noopener');
    });
  }
  // The share button exists in both modes, so its binding sits outside the standalone gate
  head.querySelector('#conv-share')?.addEventListener('click', () => {
    const url = `${location.origin}/?session=${encodeURIComponent(data.id)}`;
    navigator.clipboard.writeText(url).then(() => toast('Copied session link'), () => toast('Copy failed'));
  });
  // Raw toggle: flip mode for the current view + re-render the same session/meta. Preserve scroll position (raw/rendered heights
  // differ so there's slight drift, but that beats jumping back to the top each time).
  head.querySelector('#conv-raw')?.addEventListener('click', () => {
    _convRaw = !_convRaw;
    const scrollTop = body.scrollTop;
    renderConv(data, meta);
    $conv.querySelector('.conv-body').scrollTop = scrollTop;
  });
  if (hasMeta) {
    head.querySelector('#conv-star').addEventListener('click', () => {
      // star is a "keep viewing" state, so don't close the modal
      toggleStar(data.id);
      // Fallback meta: in extreme cases live polling may remove this entry from state.items, so find returns undefined → the meta section disappears
      renderConv(data, state.items.find(x => x.id === data.id) || meta);
    });
    head.querySelector('#conv-archive').addEventListener('click', () => {
      // archive / unarchive both close the modal and flash the dashboard to locate the card
      // because after the action the card may change scope, the user needs to see where it went
      toggleArchive(data.id, {silent: true});
      closeConversation();
      flashCard(data.id);
    });
  }
  // Export menu toggle: the document listeners are added/removed symmetrically with open/close, to avoid leaks accumulating across repeated renderConv calls.
  const exportTrigger = head.querySelector('#conv-export-trigger');
  const exportMenu = head.querySelector('#conv-export-menu');
  function onExportDocClick(e) {
    if (e.target.closest('.conv-export-wrap')) return;  // clicking inside the menu/trigger doesn't close it
    closeExportMenu();
  }
  function onExportDocKey(e) { if (e.key === 'Escape') closeExportMenu(); }
  function openExportMenu() {
    if (!exportTrigger || !exportMenu) return;
    exportTrigger.setAttribute('aria-expanded', 'true');
    exportMenu.hidden = false;
    document.addEventListener('click', onExportDocClick);
    document.addEventListener('keydown', onExportDocKey);
  }
  function closeExportMenu() {
    if (!exportTrigger || !exportMenu) return;
    exportTrigger.setAttribute('aria-expanded', 'false');
    exportMenu.hidden = true;
    document.removeEventListener('click', onExportDocClick);
    document.removeEventListener('keydown', onExportDocKey);
  }
  exportTrigger?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (exportTrigger.getAttribute('aria-expanded') === 'true') closeExportMenu();
    else openExportMenu();
  });

  // Copy-style export (shared by Copy as Markdown / Copy with AI summary); loading feedback shows on the trigger (menu already collapsed).
  async function runCopyExport(opts) {
    const btn = exportTrigger;
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = opts.icon + opts.loadingText;
    try {
      const url = `/api/sessions/${encodeURIComponent(data.id)}/transcript${opts.query || ''}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      await navigator.clipboard.writeText(text);
      const kb = (text.length / 1024).toFixed(1);
      // brief uses cache-status branches: cached/generated/regenerated/failed
      const briefStatus = res.headers.get('X-Brief-Status');
      const briefWhen = res.headers.get('X-Brief-Generated-At');
      let msg;
      if (briefStatus === 'cached') {
        msg = `Cached brief (${kb} KB, generated ${relTime(briefWhen)})`;
      } else if (briefStatus === 'generated') {
        msg = `Brief generated (${kb} KB)`;
      } else if (briefStatus === 'regenerated') {
        msg = `Brief regenerated — session evolved (${kb} KB)`;
      } else if (briefStatus === 'failed') {
        msg = `Brief failed but copied anyway (${kb} KB)`;
      } else {
        msg = `Copied ${opts.label} (${kb} KB)`;
      }
      toast(msg);
    } catch (err) {
      toast(`${opts.label} failed: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  }
  // Download for an agent: a reduced transcript with [L#] original line-number anchors, downloaded as a file (not via clipboard).
  // Uses fetch blob rather than a bare <a download>, so backend 500/404 can be caught and surfaced via toast + loading feedback.
  async function runAnchored() {
    const btn = exportTrigger;
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = ICONS.compress + 'compacting…';
    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(data.id)}/anchored`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `${data.id}.anchored.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objUrl);
      const kb = (blob.size / 1024).toFixed(1);
      toast(`Downloaded anchored transcript (${kb} KB)`);
    } catch (err) {
      toast(`Anchored failed: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  }
  head.querySelector('#conv-export-copy')?.addEventListener('click', () => {
    closeExportMenu();
    runCopyExport({ icon: ICONS.download, loadingText: 'copying…', label: 'transcript', query: '' });
  });
  head.querySelector('#conv-export-brief')?.addEventListener('click', () => {
    closeExportMenu();
    runCopyExport({ icon: ICONS.zap, loadingText: 'briefing…', label: 'transcript+brief', query: '?brief=1' });
  });
  head.querySelector('#conv-export-anchored')?.addEventListener('click', () => {
    closeExportMenu();
    runAnchored();
  });

  // Merge consecutive tool turns into a tool-group
  const grouped = [];
  for (const turn of data.turns) {
    if (turn.type === 'tool') {
      const last = grouped[grouped.length - 1];
      if (last && last._group) {
        last.tools.push(turn);
      } else {
        grouped.push({ _group: true, tools: [turn] });
      }
    } else {
      grouped.push(turn);
    }
  }

  const turnsHtml = grouped.map(item => {
    if (item._group) {
      return `<div class="conv-tools">${item.tools.map(renderConvTool).join('')}</div>`;
    }
    return renderConvTurn(item);
  }).join('') || '<div class="empty">— no conversation content —</div>';

  body.innerHTML = turnsHtml;

  // Number user turns + add anchors (for navigation jumps)
  body.querySelectorAll('.conv-user').forEach((el, i) => {
    el.id = 'conv-user-' + i;
    el.dataset.userIndex = i;
  });

  // Bind the session ID copy button (detail has moved to the head sticky area)
  head.querySelector('[data-copy-id]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    navigator.clipboard.writeText(e.currentTarget.dataset.copyId).then(() => toast('Copied session ID'), () => toast('Copy failed'));
  });
  // Bind the JSONL path copy button
  head.querySelector('[data-copy-path]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    navigator.clipboard.writeText(e.currentTarget.dataset.copyPath).then(() => toast('Copied JSONL path'), () => toast('Copy failed'));
  });

  // Bind tool collapse events
  body.querySelectorAll('.conv-tool-head').forEach(el => {
    el.addEventListener('click', () => el.closest('.conv-tool').classList.toggle('open'));
  });

  // Bind soft-fold for long text (user / assistant / skill): clicking the whole block toggles open
  // Three exclusions:
  //   - clicking links / buttons lets native interaction take priority (markdown render produces <a>)
  //   - don't trigger fold while text is selected (user is selecting content to copy, don't destroy the selection)
  //   - mark.conv-find-active: the current search-highlight hit; clicking it usually means stopping there to read, so don't fold
  body.querySelectorAll('.conv-foldable').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('a, button, [role="button"], input, textarea, mark.conv-find-active')) return;
      const sel = window.getSelection();
      if (sel && sel.toString().length > 0) return;
      el.classList.toggle('open');
    });
  });

  // Bind user-msg navigation
  $convNav = bindConvNav(body, head);

  // Bind in-conversation find
  bindConvFind(body, head);

  // standalone: set page title so the browser tab shows it
  if (_convStandalone) {
    document.title = (data.custom_title || data.project_path || data.id) + ' · Sessions';
  }
}

// User-msg navigation: scroll tracks active, prev/next/goto jump
function bindConvNav(body, head) {
  const userTurns = [...body.querySelectorAll('.conv-user')];
  const total = userTurns.length;
  const $cur = head.querySelector('.conv-nav-pos .cur');
  const $tot = head.querySelector('.conv-nav-pos .tot');
  const $prev = head.querySelector('#conv-prev');
  const $next = head.querySelector('#conv-next');
  const $goto = head.querySelector('#conv-goto');
  const $latest = head.querySelector('#conv-latest');
  $tot.textContent = total;

  let active = 0;
  // mode='programmatic': triggered by button/goto/keyboard; the scroll listener doesn't grab active (avoids the last user msg jumping back to the top one due to viewport clamp)
  // mode='manual': user actively scrolls via wheel/touch, listener takes over
  let mode = 'manual';

  function setActive(i, fromScroll = false) {
    i = Math.max(0, Math.min(total - 1, i));
    if (i === active && fromScroll) return;
    active = i;
    userTurns.forEach((el, idx) => el.classList.toggle('active', idx === i));
    $cur.textContent = i + 1;
    $prev.disabled = i === 0;
    $next.disabled = i === total - 1;
  }

  function scrollToLatest() {
    if (total > 0) setActive(total - 1);
    mode = 'programmatic';
    body.scrollTo({top: body.scrollHeight, behavior: 'smooth'});
  }

  $latest.addEventListener('click', scrollToLatest);

  if (total === 0) {
    $cur.textContent = '0';
    $prev.disabled = true; $next.disabled = true; $goto.disabled = true;
    return null;
  }

  function scrollTo(i) {
    i = Math.max(0, Math.min(total - 1, i));
    setActive(i);
    mode = 'programmatic';
    userTurns[i].scrollIntoView({behavior: 'smooth', block: 'start'});
  }

  // User actively scrolls -> unlock the listener
  ['wheel', 'touchstart'].forEach(ev =>
    body.addEventListener(ev, () => { mode = 'manual'; }, {passive: true}));

  $prev.addEventListener('click', () => scrollTo(active - 1));
  $next.addEventListener('click', () => scrollTo(active + 1));
  $goto.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = parseInt($goto.value, 10);
      if (Number.isFinite(v) && v >= 1 && v <= total) {
        scrollTo(v - 1);
        $goto.value = '';
        $goto.blur();
      }
    } else if (e.key === 'Escape') {
      $goto.value = ''; $goto.blur();
    }
  });

  // Scroll-driven active: find the nearest user msg at 80px below the viewport top
  let raf = 0;
  body.addEventListener('scroll', () => {
    if (mode === 'programmatic') return;  // user didn't actively scroll, don't grab
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const ref = body.getBoundingClientRect().top + 80;
      let idx = 0;
      for (let i = 0; i < userTurns.length; i++) {
        if (userTurns[i].getBoundingClientRect().top <= ref) idx = i;
        else break;
      }
      setActive(idx, true);
    });
  }, {passive: true});

  setActive(0);
  return {
    prev: () => scrollTo(active - 1),
    next: () => scrollTo(active + 1),
    goto: (i) => scrollTo(i),
    total,
  };
}

// In-conversation find: TreeWalker scans text nodes -> split & wrap in mark.conv-find,
// prev/next switch active within the matches array; doesn't affect user-nav highlight.
function bindConvFind(body, head) {
  const $input = head.querySelector('#conv-find');
  const $cur = head.querySelector('.conv-find-pos .cur');
  const $tot = head.querySelector('.conv-find-pos .tot');
  const $prev = head.querySelector('#conv-find-prev');
  const $next = head.querySelector('#conv-find-next');
  const $clear = head.querySelector('#conv-find-clear');
  const $scopeUser = head.querySelector('#conv-find-scope-user');
  const $scopeAsst = head.querySelector('#conv-find-scope-assistant');
  if (!$input) return;

  let matches = [];
  let active = -1;

  function clearMarks() {
    body.querySelectorAll('mark.conv-find').forEach(m => {
      const parent = m.parentNode;
      if (!parent) return;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      // Merge adjacent text nodes to avoid split leftover fragments affecting the next search
      parent.normalize();
    });
    matches = [];
    active = -1;
    $cur.textContent = '0';
    $tot.textContent = '0';
    $prev.disabled = true;
    $next.disabled = true;
  }

  function setActive(i) {
    if (matches.length === 0) {
      active = -1; $cur.textContent = '0';
      $prev.disabled = true; $next.disabled = true;
      return;
    }
    // wrap-around
    i = ((i % matches.length) + matches.length) % matches.length;
    if (active >= 0 && matches[active]) {
      matches[active].classList.remove('conv-find-active');
    }
    active = i;
    const cur = matches[i];
    cur.classList.add('conv-find-active');
    $cur.textContent = i + 1;
    $prev.disabled = false;
    $next.disabled = false;
    cur.scrollIntoView({behavior: 'smooth', block: 'center'});
  }

  function performSearch(raw) {
    clearMarks();
    const q = (raw || '').trim();
    if (!q) return;
    const qLower = q.toLowerCase();

    // role scope classification:
    // - user bucket: .conv-user (direct human input; <bash-input> also goes here)
    // - assistant bucket: agent / system-side output
    //     .conv-assistant         AI text reply
    //     .conv-skill             skill body (system-injected skill instructions)
    //     .conv-qa                AskUserQuestion (Q&A mixed; currently grouped wholesale under assistant, answers can be split out later)
    //     .conv-tools/.conv-tool  tool calls and results
    //     .conv-subagent-spawn    subagent dispatch (previously missed from classification; search isn't bound by the filter)
    //     .conv-system-event      harness-injected system events: task notification / bash output / teammate
    // Note: conv-detail has moved into the conv-head sticky area, no longer part of the body search scope (the ID is always visible, no need to search it)
    const wantUser = $scopeUser ? $scopeUser.checked : true;
    const wantAsst = $scopeAsst ? $scopeAsst.checked : true;
    const ASSISTANT_CLASSES = [
      'conv-assistant', 'conv-skill', 'conv-qa',
      'conv-tools', 'conv-tool',
      'conv-subagent-spawn',
      'conv-system-event',
    ];

    // Soft-fold interaction: when the search term hits the full text of a turn, auto-expand that turn so the hit is directly visible.
    // Without expanding, the hit might be inside the hidden fold-full, causing a "count exceeds what's visible" mismatch in the UI.
    body.querySelectorAll('.conv-foldable').forEach(el => {
      const fullEl = el.querySelector('.fold-full');
      if (fullEl && fullEl.textContent.toLowerCase().includes(qLower)) {
        el.classList.add('open');
      }
    });

    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
        let inUser = false, inAsst = false;
        // Fold segments: is the text in fold-summary or fold-full? Record it then compare against .open,
        // skipping the currently invisible copy -- otherwise the same text gets matched twice (summary
        // and full both exist in the DOM), doubling the count.
        let inSummary = false, inFull = false, foldableOpen = null;
        let p = node.parentNode;
        while (p && p !== body) {
          const tag = p.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
          if (p.classList) {
            if (!inUser && p.classList.contains('conv-user')) inUser = true;
            if (!inAsst) {
              for (const c of ASSISTANT_CLASSES) {
                if (p.classList.contains(c)) { inAsst = true; break; }
              }
            }
            if (!inSummary && p.classList.contains('fold-summary')) inSummary = true;
            if (!inFull && p.classList.contains('fold-full')) inFull = true;
            if (foldableOpen === null && p.classList.contains('conv-foldable')) {
              foldableOpen = p.classList.contains('open');
            }
          }
          p = p.parentNode;
        }
        if (inUser && !wantUser) return NodeFilter.FILTER_REJECT;
        if (inAsst && !wantAsst) return NodeFilter.FILTER_REJECT;
        // Inside a fold region: match only the visible copy based on the current open state
        if (inSummary && foldableOpen === true) return NodeFilter.FILTER_REJECT;
        if (inFull && foldableOpen === false) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const textNodes = [];
    let n; while ((n = walker.nextNode())) textNodes.push(n);

    for (let node of textNodes) {
      let text = node.nodeValue;
      let lower = text.toLowerCase();
      let start;
      while ((start = lower.indexOf(qLower)) !== -1) {
        const before = text.slice(0, start);
        const matchTxt = text.slice(start, start + qLower.length);
        const after = text.slice(start + qLower.length);
        node.nodeValue = before;
        const mark = document.createElement('mark');
        mark.className = 'conv-find';
        mark.textContent = matchTxt;
        const afterNode = document.createTextNode(after);
        const parent = node.parentNode;
        parent.insertBefore(mark, node.nextSibling);
        parent.insertBefore(afterNode, mark.nextSibling);
        matches.push(mark);
        node = afterNode;
        text = after;
        lower = text.toLowerCase();
      }
    }

    $tot.textContent = matches.length;
    if (matches.length > 0) setActive(0);
  }

  // debounce input
  let debounceTimer = 0;
  $input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => performSearch($input.value), 150);
  });

  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      // Enter pressed during debounce: trigger a sync search once first
      if (matches.length === 0) {
        clearTimeout(debounceTimer);
        performSearch($input.value);
      }
      if (matches.length === 0) return;
      setActive(active + (e.shiftKey ? -1 : 1));
    } else if (e.key === 'Escape') {
      // Two-stage Esc, consistent with files-search: if there's content, clear it first and keep focus so input can continue (don't bubble up to close the modal);
      // if empty, let it through -> bubble to the global handler to close the conv modal.
      if ($input.value) {
        e.preventDefault();
        e.stopPropagation();
        $input.value = '';
        clearMarks();
      }
    }
  });

  $prev.addEventListener('click', () => { if (matches.length) setActive(active - 1); });
  $next.addEventListener('click', () => { if (matches.length) setActive(active + 1); });
  $clear.addEventListener('click', () => {
    $input.value = '';
    clearMarks();
    $input.focus();
  });

  // scope checkboxes scope:
  //   1. hide turns not in that bucket (visibility filter)
  //   2. if there's find input, re-run the search (so hits are also limited to that bucket)
  // Both can't be off at once (auto-bounce the one just turned off), otherwise the page would be entirely empty.
  // Attach hide-user-bucket / hide-asst-bucket class on body; CSS handles the hiding separately.
  function applyScopeVisibility() {
    const root = $conv || document.body;
    root.classList.toggle('hide-user-bucket', !$scopeUser.checked);
    root.classList.toggle('hide-asst-bucket', !$scopeAsst.checked);
  }
  function bindScope(cb, other) {
    if (!cb || !other) return;
    cb.addEventListener('change', () => {
      if (!cb.checked && !other.checked) {
        cb.checked = true;  // keep at least one on
        toast('Keep at least one scope');  // otherwise the checkbox bounces back on itself and the user thinks the click missed
        return;
      }
      applyScopeVisibility();
      if ($input.value.trim()) performSearch($input.value);
    });
  }
  bindScope($scopeUser, $scopeAsst);
  bindScope($scopeAsst, $scopeUser);
  applyScopeVisibility();  // attach once initially, ensuring consistent state after refresh / switching session
}

function renderMarkdown(text) {
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
    return escapeHtml(text);
  }
  return DOMPurify.sanitize(marked.parse(text || ''));
}

function markdownPreviewText(renderedHtml) {
  const template = document.createElement('template');
  template.innerHTML = renderedHtml || '';
  const selectors = 'h1,h2,h3,h4,h5,p,li,pre,blockquote,tr';
  const blocks = [...template.content.querySelectorAll(selectors)]
    .filter(el => !el.parentElement?.closest(selectors))
    .map(el => (el.textContent || '').trim())
    .filter(Boolean);
  return (blocks.length ? blocks.join('\n') : (template.content.textContent || ''))
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

/* Long-text soft-fold: when exceeding the threshold, return a "head + middle elided + tail" summary + hidden full-text DOM,
   with the .open class toggling visibility. See FOLD_LIMITS for each turn type's thresholds (user folds more
   aggressively than assistant, because the typical user-paste pattern = a big paste wanting a quick overview scan).
   When useMarkdown=true the full text goes through markdown render, while the summary uses rendered plain text.
   Half-cut markdown can render incompletely (unbalanced ** ` []), so never parse the sliced preview directly. */
function renderFoldableText(text, headLen, tailLen, useMarkdown) {
  const t = text || '';
  // Raw mode globally overrides useMarkdown: source text is escaped and shown monospace (no .md, keeps pre-wrap).
  const useMd = useMarkdown && !_convRaw;
  const fullInner = useMd ? renderMarkdown(t) : escapeHtml(t);
  const fullCls = useMd ? 'md' : 'raw';
  const threshold = headLen + tailLen + 150;  // don't fold when only slightly over the threshold, to avoid meaningless hints like hidden=20
  if (t.length <= threshold) {
    return `<div class="conv-text ${fullCls}">${fullInner}</div>`;
  }
  const preview = useMd ? (markdownPreviewText(fullInner) || t) : t;
  const head = preview.slice(0, headLen);
  const tail = preview.slice(-tailLen);
  const hidden = Math.max(0, preview.length - headLen - tailLen).toLocaleString();
  return `
    <div class="conv-text fold-summary">${escapeHtml(head)}<span class="fold-hint">⋯ ${hidden} chars hidden · click to expand ⋯</span>${escapeHtml(tail)}</div>
    <div class="conv-text ${fullCls} fold-full">${fullInner}</div>`;
}

// Fold thresholds per turn type (first N chars / last N chars). tool / system_event stay single-line
// and compact (no fold). Under pre-wrap, newlines consume rows (200 chars of markdown may stretch to 15+
// lines), so the real head/tail char count matters more than it looks -- skill body folds harder (more newlines).
const FOLD_LIMITS = {
  user: [300, 300],     // typical user paste = long text/paths/error logs; 300 on each side is enough for a quick scan
  assistant: [500, 400], // AI replies are information-dense; the head summary has high value, leave a bit less for the tail
  skill: [180, 80],     // skill body is system-injected reference; just need to see "which skill is loaded" + the ending
};

function renderConvTurn(turn) {
  if (turn.type === 'user') {
    const [h, t] = FOLD_LIMITS.user;
    return `
      <div class="conv-turn conv-user conv-foldable">
        <div class="conv-turn-head">
          <span class="conv-role">you</span>
          <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
        </div>
        ${renderFoldableText(turn.text, h, t, true)}
      </div>`;
  }
  if (turn.type === 'assistant') {
    const [h, t] = FOLD_LIMITS.assistant;
    return `
      <div class="conv-turn conv-assistant conv-foldable">
        ${renderFoldableText(turn.text, h, t, true)}
      </div>`;
  }
  if (turn.type === 'skill') {
    const [h, t] = FOLD_LIMITS.skill;
    return `
      <div class="conv-turn conv-skill conv-foldable">
        <div class="conv-turn-head">
          <span class="conv-role">skill</span>
          <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
        </div>
        ${renderFoldableText(turn.text, h, t, true)}
      </div>`;
  }
  if (turn.type === 'qa') {
    return `
      <div class="conv-turn conv-qa">
        <div class="conv-turn-head">
          <span class="conv-role">Q&amp;A</span>
          <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
        </div>
        ${(turn.questions || []).map(renderQaQuestion).join('')}
      </div>`;
  }
  if (turn.type === 'subagent_spawn') {
    const name = escapeHtml(turn.name || 'subagent');
    const desc = turn.description ? escapeHtml(turn.description) : '';
    return `
      <div class="conv-turn conv-subagent-spawn">
        <div class="spawn-line">
          <span class="spawn-icon">🧬</span>
          <span class="spawn-text">spawned subagent: <span class="spawn-name">${name}</span></span>
          <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
        </div>
        ${desc ? `<div class="spawn-desc">${desc}</div>` : ''}
      </div>`;
  }
  // System events (harness-injected pseudo-messages with user role): same side as assistant/tool, but different semantics --
  // task notification is a background task report, bash output is !command output, teammate is a teammate agent's report.
  // Single-line compact render (consistent with tool turn style), not counted as user input.
  if (turn.type === 'system_notification') {
    return `
      <div class="conv-turn conv-system-event conv-system-notification">
        <span class="sysev-icon">🛎️</span>
        <span class="sysev-role">notif</span>
        <span class="sysev-text">${escapeHtml(turn.text || '')}</span>
        <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
      </div>`;
  }
  if (turn.type === 'bash_output') {
    return `
      <div class="conv-turn conv-system-event conv-bash-output">
        <span class="sysev-icon">⌨</span>
        <span class="sysev-role">bash</span>
        <span class="sysev-text">${escapeHtml(turn.text || '')}</span>
        <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
      </div>`;
  }
  if (turn.type === 'teammate_message') {
    return `
      <div class="conv-turn conv-system-event conv-teammate-message">
        <span class="sysev-icon">📨</span>
        <span class="sysev-role">team</span>
        <span class="sysev-text">${escapeHtml(turn.text || '')}</span>
        <span class="conv-ts">${escapeHtml(turn.ts || '')}</span>
      </div>`;
  }
  return '';
}

function renderQaQuestion(q) {
  const isOther = q.matched_option == null && q.answer;
  const optionsHtml = (q.options || []).map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    const selected = i === q.matched_option;
    // omit description when matched to save space; keep it for Other (so the user sees which option was rejected)
    const descBlock = (isOther && opt.description)
      ? `<div class="conv-qa-option-desc">${escapeHtml(opt.description)}</div>`
      : '';
    const previewBlock = (isOther && opt.preview)
      ? `<pre class="conv-qa-option-preview">${escapeHtml(opt.preview)}</pre>`
      : '';
    return `
      <li class="conv-qa-option${selected ? ' selected' : ''}">
        <span class="conv-qa-option-letter">[${letter}]</span>
        <span class="conv-qa-option-label">${escapeHtml(opt.label)}</span>
        ${descBlock}
        ${previewBlock}
      </li>`;
  }).join('');
  let answerBlock;
  if (!q.answer) {
    answerBlock = `<div class="conv-qa-answer conv-qa-answer-empty">→ (no answer)</div>`;
  } else if (q.matched_option != null) {
    const letter = String.fromCharCode(65 + q.matched_option);
    answerBlock = `<div class="conv-qa-answer">→ ${letter} (selected): ${escapeHtml(q.answer)}</div>`;
  } else {
    // Other self-filled = the user's most important correction signal, highlight it
    answerBlock = `<div class="conv-qa-answer conv-qa-answer-other"><span class="conv-qa-other-tag">Other</span>${escapeHtml(q.answer)}</div>`;
  }
  return `
    <div class="conv-qa-question">
      <div class="conv-qa-q-text">${escapeHtml(q.question)}</div>
      <ul class="conv-qa-options">${optionsHtml}</ul>
      ${answerBlock}
    </div>`;
}

function renderConvTool(t) {
  const errCls = t.is_error ? ' conv-tool-error' : '';
  return `
    <div class="conv-tool${errCls}">
      <div class="conv-tool-head">
        <span class="conv-tool-caret">${ICONS.chevron}</span>
        <span class="conv-tool-name">${escapeHtml(t.name)}</span>
        <span class="conv-tool-summary">${escapeHtml(t.summary)}</span>
      </div>
      <div class="conv-tool-body">${escapeHtml(t.result || '')}</div>
    </div>`;
}

// Conversation global keyboard: Escape closes, j/k switch user msg
document.addEventListener('keydown', (e) => {
  // Files modal takes priority: when open, Escape closes it and doesn't bubble to conv handling
  if ($files && $files.classList.contains('open') && e.key === 'Escape') {
    closeFilesModal();
    return;
  }
  if (!$conv || !$conv.classList.contains('open')) return;
  // Don't intercept when an input is focused
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;

  if (e.key === 'Escape' && !_convStandalone) {
    closeConversation();
  } else if (e.key === 'j' && $convNav) {
    e.preventDefault(); $convNav.next();
  } else if (e.key === 'k' && $convNav) {
    e.preventDefault(); $convNav.prev();
  }
});

// Cmd/Ctrl+F: focus the corresponding search box based on the currently open context (Files panel > in-conversation find > dashboard full-text)
// capture phase + preventDefault + stopPropagation is required to intercept the browser's native Find bar.
// e.code === 'KeyF' is a fallback for different keyboard layouts
document.addEventListener('keydown', (e) => {
  const cmd = e.metaKey || e.ctrlKey;
  if (!cmd || e.shiftKey || e.altKey || e.code !== 'KeyF') return;
  let target = null;
  if ($files && $files.classList.contains('open')) {
    target = document.getElementById('files-search');
  } else if ($conv && $conv.classList.contains('open')) {
    target = document.getElementById('conv-find');
  } else {
    target = $search;
  }
  if (!target) return;
  e.preventDefault();
  e.stopPropagation();
  target.focus();
  target.select();  // select existing content so typing overwrites it directly
}, true);

async function load() {
  $count.textContent = 'loading…';
  try {
    const res = await fetch('/api/sessions');
    state.items = await res.json();
    pruneCardCollapsed();  // clear fold records for sessions that no longer exist

    // When restoring a persisted search term, fire a backend search once more
    if (state.q) {
      try {
        const sr = await fetch('/api/search?q=' + encodeURIComponent(state.q));
        const hits = await sr.json();
        state.searchHits = {};
        for (const h of hits) state.searchHits[h.id] = h.snippets;
      } catch { state.searchHits = {}; }
    }

    render();
    _liveSig = sessionsSignature(state.items);  // align the live baseline, avoiding an empty redraw on the very first poll right after
    markLive();  // after the first load, the heartbeat dot enters the "alive" state
  } catch (err) {
    // C4 error state: explain + retryable + point out "the dashboard will auto-reconnect", so the user doesn't think it's fully dead
    $list.innerHTML = `<div class="empty"><div class="empty-title">Couldn't load sessions</div><div class="empty-hint">${escapeHtml(err.message)} · the dashboard will auto-reconnect</div><button class="empty-action" id="list-retry">Retry</button></div>`;
    document.getElementById('list-retry')?.addEventListener('click', load);
  }
}

// Search (debounced, calls backend for full-text search)
let searchTimer;
let searchSeq = 0;  // prevent stale requests from overwriting newer results
function syncSearchClear() {
  $searchWrap.classList.toggle('has-value', $search.value.length > 0);
}
$searchClear.addEventListener('click', () => {
  $search.value = '';
  syncSearchClear();
  $search.dispatchEvent(new Event('input'));
  $search.focus();
});
$search.addEventListener('input', () => {
  syncSearchClear();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const newQ = $search.value.trim();
    if (newQ !== state.q) state.sectionClosed.clear();
    state.q = newQ;
    saveUIState();

    if (!newQ) {
      $searchWrap.classList.remove('searching');
      state.searchHits = {};
      render();
      return;
    }

    // Enter the "searching" state: counter text + search-box spinner, making the wait visible with 0 delay.
    // Stale requests superseded by later input don't clear searching on early-return (the new request is still spinning);
    // only the latest request finishes up at the end, avoiding the spinner stopping too early during rapid typing.
    $count.textContent = 'searching…';
    $searchWrap.classList.add('searching');

    const seq = ++searchSeq;
    try {
      // Refresh the session list before searching: (1) search filters against state.items (render line ~2242
      // intersect hitIds); (2) the backend search_sessions only iterates files already scanned into _cache,
      // so a new session can't even be found by the backend without triggering a scan first. Hence the required order:
      // /api/sessions refreshes the backend _cache + frontend state.items first, then /api/search can hit a just-born new session.
      const sessRes = await fetch('/api/sessions');
      if (seq !== searchSeq) return;  // a newer request has taken over, keep searching
      const items = await sessRes.json();
      state.items = items;
      _liveSig = sessionsSignature(items);  // align the live baseline, avoiding an empty redraw on the first poll after clearing the search
      const res = await fetch('/api/search?q=' + encodeURIComponent(newQ));
      if (seq !== searchSeq) return;
      const hits = await res.json();
      state.searchHits = {};
      for (const h of hits) {
        state.searchHits[h.id] = h.snippets;
      }
    } catch {
      if (seq !== searchSeq) return;
      state.searchHits = {};
    }
    $searchWrap.classList.remove('searching');
    render();
  }, 250);
});

// Restore the persisted search term: trigger a backend search once at startup
if (state.q) {
  $search.value = state.q;
  syncSearchClear();
  // Defer the search until load completes (triggered inside load())
}

// ---------- Source filter dropdown ----------
// Replaces the original "Claude Sessions" title position. Clicking the trigger expands the dropdown; options toggle the global filter state.
// Affects: card list / per-section counts / top-bar total / top-bar full-text search results (frontend filter).
// Doesn't affect: detail modal's internal find / archive / star / note / files / export / brief.
const SOURCE_FILTER_LABELS = {
  all: 'All Sessions',
  claude: 'Claude only',
  codex: 'Codex only',
  antigravity: 'Antigravity only',
};
const $sourceFilter = document.getElementById('source-filter');
const $sourceFilterTrigger = document.getElementById('source-filter-trigger');
const $sourceFilterLabel = document.getElementById('source-filter-label');
const $sourceFilterMenu = document.getElementById('source-filter-menu');

function syncSourceFilterUI() {
  $sourceFilterLabel.textContent = SOURCE_FILTER_LABELS[state.sourceFilter] || SOURCE_FILTER_LABELS.all;
  // color the trigger label by the current filter state (CSS [data-source] hook)
  $sourceFilter.dataset.source = state.sourceFilter;
  $sourceFilterMenu.querySelectorAll('.source-filter-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.value === state.sourceFilter);
  });
}

let _sourceOutsideHandler = null;
function setSourceFilterOpen(open) {
  $sourceFilter.dataset.open = open ? 'true' : 'false';
  $sourceFilterTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  // When opening, attach a capture-phase click listener: an outside click calls stopPropagation during the capture phase,
  // so the card's bubble-phase click listener never fires — this both closes the menu and avoids opening a conversation by mistake.
  // (Note: must use click rather than mousedown — stopPropagation on mousedown does not block the subsequent click.)
  if (open) {
    _sourceOutsideHandler = (ev) => {
      if ($sourceFilter.contains(ev.target)) return;
      ev.stopPropagation();
      ev.preventDefault();
      setSourceFilterOpen(false);
    };
    setTimeout(() => document.addEventListener('click', _sourceOutsideHandler, true), 0);
  } else if (_sourceOutsideHandler) {
    document.removeEventListener('click', _sourceOutsideHandler, true);
    _sourceOutsideHandler = null;
  }
}

$sourceFilterTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = $sourceFilter.dataset.open === 'true';
  setSourceFilterOpen(!isOpen);
});

$sourceFilterMenu.addEventListener('click', (e) => {
  const opt = e.target.closest('.source-filter-option');
  if (!opt) return;
  const value = opt.dataset.value;
  if (!SOURCE_FILTER_VALUES.includes(value)) return;
  if (value !== state.sourceFilter) {
    state.sourceFilter = value;
    syncSourceFilterUI();
    saveUIState();
    render();
  }
  setSourceFilterOpen(false);
});

// Closing on outside click is already handled by setSourceFilterOpen's capture listener (with interception to prevent mis-taps)
// Close on Esc
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $sourceFilter.dataset.open === 'true') {
    setSourceFilterOpen(false);
  }
});

// On startup, sync the UI to state (when restoring from localStorage)
syncSourceFilterUI();

// Hide one-shot (claude -p) toggle
const $hideOneshot = document.getElementById('hide-oneshot');
$hideOneshot.checked = state.hideOneshot;
$hideOneshot.addEventListener('change', () => {
  state.hideOneshot = $hideOneshot.checked;
  saveUIState();
  render();
});

// Refresh (manual full reload, always the fallback)
document.getElementById('refresh').addEventListener('click', (e) => {
  const b = e.currentTarget;
  b.classList.remove('spinning'); void b.offsetWidth; b.classList.add('spinning');
  b.addEventListener('animationend', () => b.classList.remove('spinning'), {once: true});
  load();
});
bindCollapseAllBtn();

// ---------- Live auto-refresh (visibility gating + adaptive cadence + fingerprint comparison) ----------
// Design: a local single-user tool — the cost of near-real-time isn't "how often the frontend asks", but "whether each ask triggers a full-page repaint".
// So: (1) only ask when the dashboard is visible; (2) if the fingerprint is unchanged, don't move a single line (silent, zero flicker);
//    (3) recent interaction → 3s, idle for a long time → back off to 20s; (4) on tab refocus, pull immediately;
//    (5) don't auto-overwrite while in search mode / a write is in flight.
let _liveSig = null;            // last data fingerprint; skip render if unchanged
let _liveTimer = null;
let _livePolling = false;       // reentrancy lock: visibilitychange and the timer may fire concurrently
let _lastInteractionAt = 0;     // timestamp of the most recent user interaction (ms)

const LIVE_FAST_MS = 3000;      // active: recent interaction or a change was just detected
const LIVE_SLOW_MS = 20000;     // idle: no interaction for a long time
const LIVE_ACTIVE_WINDOW_MS = 60000;  // how long after an interaction still counts as "active"

// Cheap fingerprint: only include fields that affect display and are backend-authoritative (scope is a frontend-derived value, not in the fingerprint).
// star/archive don't change the jsonl mtime, so they must be included explicitly — otherwise a state change made elsewhere wouldn't be visible.
function sessionsSignature(items) {
  let s = items.length + '|';
  for (const m of items) {
    s += m.id + ':' + m.mtime + ':' + (m.starred ? 1 : 0) + ':' + (m.archived ? 1 : 0) + ',';
  }
  return s;
}

function liveInterval() {
  const active = (Date.now() - _lastInteractionAt) < LIVE_ACTIVE_WINDOW_MS;
  return active ? LIVE_FAST_MS : LIVE_SLOW_MS;
}

// B1 heartbeat dot: data successfully pulled → update the "last checked" tooltip; data actually changed → give it a beat.
function markLive() {
  const dot = document.getElementById('live-dot');
  if (!dot) return;
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  dot.dataset.tooltip = `Live — checked ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
}
function beatLive() {
  const dot = document.getElementById('live-dot');
  if (!dot) return;
  dot.classList.add('beat');
  setTimeout(() => dot.classList.remove('beat'), 800);
}
// B2 only flash the cards that are "truly new / had their mtime advance" (not the whole page; capped at ≤10 to avoid a flash storm).
// No scrollIntoView — a background update shouldn't hijack the user's viewport; just give a subtle flash in place to signal "this changed here".
function flashLiveCards(ids) {
  if (!ids || !ids.length) return;
  requestAnimationFrame(() => {
    ids.slice(0, 10).forEach(id => {
      const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if (card) {
        card.classList.add('card-flash');
        card.addEventListener('animationend', () => card.classList.remove('card-flash'), {once: true});
      }
    });
  });
}

function scheduleLive() {
  clearTimeout(_liveTimer);
  _liveTimer = setTimeout(livePoll, liveInterval());
}

async function livePoll() {
  // Gate: standalone single-session mode has no dashboard at all, so stop outright (no reschedule)
  if (document.body.classList.contains('standalone')) return;
  if (_livePolling) { scheduleLive(); return; }  // reentrancy: the previous round hasn't finished — let it wrap up
  // Invisible (tab switched away) / search mode / write in flight: skip this round but keep scheduling, try again next round
  const skip = document.visibilityState !== 'visible'
            || !!state.q
            || _inflightMutations > 0;
  if (skip) { scheduleLive(); return; }
  _livePolling = true;
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const items = await res.json();
    markLive();  // B1 data pulled = dashboard is alive, refresh "last checked"
    const sig = sessionsSignature(items);
    if (sig !== _liveSig) {
      // B2 compute the ids that are new/advanced (old mtime vs new), and after render flash only these
      const prev = new Map(state.items.map(m => [m.id, m.mtime]));
      const changedIds = items.filter(m => !prev.has(m.id) || prev.get(m.id) !== m.mtime).map(m => m.id);
      _liveSig = sig;
      state.items = items;
      _lastInteractionAt = Date.now();  // a real change → enter active cadence, ask more frequently next round
      render();
      flashLiveCards(changedIds);
      beatLive();
    }
  } catch {
    // Network jitter / service restart: ignore, retry next round
  } finally {
    _livePolling = false;
  }
  scheduleLive();
}

// Interaction tracking: any interaction refreshes the "active" timestamp (just an assignment, negligible cost)
['mousemove', 'keydown', 'click', 'wheel', 'touchstart'].forEach(ev => {
  window.addEventListener(ev, () => { _lastInteractionAt = Date.now(); }, {passive: true});
});

// Tab refocus: pull immediately (don't wait for the next tick), so the first glance on return is up to date
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'
      && !document.body.classList.contains('standalone')) {
    _lastInteractionAt = Date.now();
    livePoll();  // it reschedules itself internally
  }
});

// Initial load — detect ?session=<id> to enter standalone mode (browse a single session in its own tab)
applyColLeftPct();
{
  const sid = new URLSearchParams(location.search).get('session');
  if (sid) {
    document.body.classList.add('standalone');
    openConversation(sid, {standalone: true});
  } else {
    load();
    scheduleLive();  // start the live heartbeat (not started in standalone mode)
  }
}

// ---------- Note modal ----------
(function() {
  // Create the modal DOM (singleton)
  const overlay = document.createElement('div');
  overlay.className = 'note-overlay';
  overlay.style.display = 'none';
  overlay.innerHTML = `
    <div class="note-dialog">
      <div class="note-dialog-title">Session Note</div>
      <textarea id="note-textarea" name="note" aria-label="Session note" placeholder="Add a note… (save empty to clear)"></textarea>
      <div class="note-dialog-foot">
        <button class="btn-cancel">Cancel</button>
        <button class="btn-save">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const ta = overlay.querySelector('textarea');
  const btnSave = overlay.querySelector('.btn-save');
  const btnCancel = overlay.querySelector('.btn-cancel');
  let _resolve = null;

  function openNoteModal(current) {
    return new Promise(resolve => {
      _resolve = resolve;
      ta.value = current || '';
      overlay.style.display = 'flex';
      // Wait until render is done before focusing, to avoid a Safari issue
      requestAnimationFrame(() => { ta.focus(); ta.select(); });
    });
  }

  function close(value) {
    overlay.style.display = 'none';
    if (_resolve) { _resolve(value); _resolve = null; }
  }

  btnSave.addEventListener('click', () => close(ta.value));
  btnCancel.addEventListener('click', () => close(null));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
  document.addEventListener('keydown', e => {
    if (overlay.style.display === 'none') return;
    if (e.key === 'Escape') { e.preventDefault(); close(null); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); close(ta.value); }
  });

  // Attach to global scope so bindCardEvents can call it
  window.openNoteModal = openNoteModal;
})();

// PWA service worker registration — to satisfy Chrome's heuristic check for the install prompt
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.warn('[sw] register failed:', err));
  });
}

// ---------- Prompt Queue ----------
// FAB pill + modal: serially stack the prompt texts waiting to be sent, auto-grow for multiple lines, one-click copy per cell
// Persisted in localStorage ('qq.items', reusing the old key without migration)
(function() {
  // In standalone mode (?session=<id>) the full queue isn't mounted — the single-session reading page doesn't need it.
  if (document.body.classList.contains('standalone')) {
    return;
  }

  const STORAGE_KEY = 'qq.items';

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.map(x => typeof x === 'string' ? x : '') : [];
    } catch { return []; }
  }
  function saveItems() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
  }

  let items = loadItems();

  // ---- FAB ----
  const fab = document.createElement('button');
  fab.className = 'qq-fab';
  fab.title = 'Prompt Queue';
  fab.setAttribute('aria-label', 'Open Prompt Queue');
  fab.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="9" y1="6" x2="20" y2="6"></line>
      <line x1="9" y1="12" x2="20" y2="12"></line>
      <line x1="9" y1="18" x2="20" y2="18"></line>
      <circle cx="4.5" cy="6" r="1.5" fill="currentColor"></circle>
      <circle cx="4.5" cy="12" r="1.5" fill="currentColor"></circle>
      <circle cx="4.5" cy="18" r="1.5" fill="currentColor"></circle>
    </svg>
    <span class="qq-fab-label">Prompt Queue</span>
    <span class="qq-fab-badge"></span>`;
  document.body.appendChild(fab);
  const badge = fab.querySelector('.qq-fab-badge');

  // ---- Overlay + Modal ----
  const overlay = document.createElement('div');
  overlay.className = 'qq-overlay';
  overlay.innerHTML = `
    <div class="qq-modal" role="dialog" aria-label="Prompt Queue">
      <div class="qq-head">
        <div class="qq-title">Prompt Queue</div>
        <div class="qq-count"></div>
        <div class="qq-spacer"></div>
        <button class="qq-close" type="button" aria-label="Close">${ICONS.close}</button>
      </div>
      <div class="qq-body"></div>
      <div class="qq-foot">
        <button class="qq-add-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Query</span>
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const $body = overlay.querySelector('.qq-body');
  const $count = overlay.querySelector('.qq-count');
  const $addBtn = overlay.querySelector('.qq-add-btn');
  const $closeBtn = overlay.querySelector('.qq-close');

  // ---- Pointer-based DnD state ----
  // dragState: { srcIdx, ghost, origItems } | null
  //   srcIdx     —— the dragged cell's current index in items (updated after each splice)
  //   ghost      —— the floating chip that follows the cursor
  //   origItems  —— starting snapshot, used to roll back on Escape
  // During pointermove, directly splice items + move the DOM (no render, to avoid listener-rebuild flicker),
  // and persist on pointerup. Escape rolls back to origItems.
  let dragState = null;

  function updateBadge() {
    const n = items.filter(s => s && s.trim().length > 0).length;
    if (n > 0) { badge.textContent = String(n); badge.classList.add('show'); }
    else { badge.classList.remove('show'); }
  }

  function autoGrow(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  // Pick the grid column span by content length: short queries become small tiles, long queries take the full row
  // Synced live while typing (called inside the input listener), so the user watches the tile grow as they write
  function computeSpan(text) {
    const t = text || '';
    const len = t.length;
    const lines = t.split('\n').length;
    if (lines >= 3 || len > 200) return 12;
    if (len > 80) return 8;
    if (len > 24) return 6;
    return 4;
  }
  function applySpan(cell, text) {
    // With only 1 cell, force a full 12-column span — the dense tiling is meant for piecing together multiple tiles,
    // and a lone cell's whitespace looks like a bug. When adding/removing cells, render() reruns applySpan.
    const span = items.length <= 1 ? 12 : computeSpan(text);
    cell.style.setProperty('--span', String(span));
  }

  // ---- Pointer DnD: helpers ----
  function positionGhost(ghost, x, y) {
    // Offset by +14/+14 so the ghost sits to the lower-right of the cursor and doesn't block the view
    ghost.style.left = (x + 14) + 'px';
    ghost.style.top = (y + 14) + 'px';
  }
  function reindexCells() {
    Array.from($body.children).forEach((c, i) => {
      if (c.classList.contains('qq-cell')) c.dataset.idx = String(i);
    });
  }
  function startDrag(srcIdx, srcCell, e) {
    const ghost = document.createElement('div');
    ghost.className = 'qq-drag-ghost';
    const text = items[srcIdx] || '';
    if (text.trim()) {
      ghost.textContent = text.length > 100 ? text.slice(0, 100) + '…' : text;
    } else {
      ghost.classList.add('empty');
      ghost.textContent = '(empty)';
    }
    document.body.appendChild(ghost);
    positionGhost(ghost, e.clientX, e.clientY);
    srcCell.classList.add('dragging');

    dragState = { srcIdx, ghost, origItems: items.slice() };

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
    document.addEventListener('keydown', onDragKeydown);
  }
  function onPointerMove(e) {
    if (!dragState) return;
    e.preventDefault();
    positionGhost(dragState.ghost, e.clientX, e.clientY);

    // The dragging cell already has pointer-events:none, so elementFromPoint naturally passes through to the cell below
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tgtCell = el && el.closest && el.closest('.qq-cell');
    if (!tgtCell || !$body.contains(tgtCell)) return;
    const tgtIdx = Number(tgtCell.dataset.idx);
    if (tgtIdx === dragState.srcIdx) return;

    const rect = tgtCell.getBoundingClientRect();
    const left = (e.clientX - rect.left) < rect.width / 2;
    let newIdx;
    if (left) {
      newIdx = tgtIdx > dragState.srcIdx ? tgtIdx - 1 : tgtIdx;
    } else {
      newIdx = tgtIdx > dragState.srcIdx ? tgtIdx : tgtIdx + 1;
    }
    if (newIdx === dragState.srcIdx) return;

    // Do the DOM move + items splice together, to avoid listener-rebuild flicker
    const cells = Array.from($body.children).filter(c => c.classList.contains('qq-cell'));
    const draggedCell = cells[dragState.srcIdx];
    if (!draggedCell) return;
    if (newIdx > dragState.srcIdx) {
      cells[newIdx].after(draggedCell);
    } else {
      cells[newIdx].before(draggedCell);
    }
    const moved = items.splice(dragState.srcIdx, 1)[0];
    items.splice(newIdx, 0, moved);
    dragState.srcIdx = newIdx;
    reindexCells();
  }
  function onPointerUp() {
    if (!dragState) return;
    saveItems();
    cleanupDrag();
  }
  function onDragKeydown(e) {
    if (!dragState || e.key !== 'Escape') return;
    e.preventDefault();
    e.stopPropagation();
    // Roll back to the pre-drag order, re-render so all listeners are clean
    items.length = 0;
    Array.prototype.push.apply(items, dragState.origItems);
    cleanupDrag();
    render();
  }
  function cleanupDrag() {
    if (dragState && dragState.ghost) dragState.ghost.remove();
    dragState = null;
    $body.querySelectorAll('.qq-cell.dragging').forEach(c => c.classList.remove('dragging'));
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);
    document.removeEventListener('keydown', onDragKeydown);
  }

  function render() {
    const total = items.length;
    $count.textContent = total ? `${total} item${total > 1 ? 's' : ''}` : '';
    $body.innerHTML = '';

    if (total === 0) {
      const empty = document.createElement('div');
      empty.className = 'qq-empty';
      empty.textContent = 'No queries yet';
      $body.appendChild(empty);
      return;
    }

    items.forEach((text, idx) => {
      const cell = document.createElement('div');
      cell.className = 'qq-cell';
      cell.dataset.idx = String(idx);
      cell.innerHTML = `
        <div class="qq-drag-handle" title="Drag to reorder" aria-label="Drag to reorder">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
            <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
            <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/>
          </svg>
        </div>
        <textarea class="qq-cell-ta" name="prompt-queue-item" aria-label="Prompt queue item" rows="1" placeholder="Type your query…" spellcheck="false"></textarea>
        <div class="qq-cell-actions">
          <button class="qq-cell-btn qq-copy-btn" type="button" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="qq-btn-label">Copy</span>
          </button>
          <button class="qq-cell-btn danger qq-del-btn" type="button" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
            <span class="qq-btn-label">Delete</span>
          </button>
        </div>`;

      const ta = cell.querySelector('textarea');
      ta.value = text;
      applySpan(cell, text);
      // Measure once immediately, but the DOM hasn't reflowed yet so scrollHeight may be too low → top it up again on rAF
      autoGrow(ta);
      requestAnimationFrame(() => autoGrow(ta));

      ta.addEventListener('input', () => {
        const i = Number(cell.dataset.idx);
        items[i] = ta.value;
        saveItems();
        // live resize: span changes with character count so the tile grows as you write; when width changes, re-measure the textarea height
        const beforeSpan = cell.style.getPropertyValue('--span');
        applySpan(cell, ta.value);
        if (cell.style.getPropertyValue('--span') !== beforeSpan) {
          requestAnimationFrame(() => autoGrow(ta));
        } else {
          autoGrow(ta);
        }
        updateBadge();
      });

      cell.querySelector('.qq-copy-btn').addEventListener('click', () => {
        const i = Number(cell.dataset.idx);
        const text = items[i] || '';
        if (!text) { toast('Empty query'); return; }
        navigator.clipboard.writeText(text).then(
          () => {
            toast(`Copied query #${i + 1}`);
            // Flash a gold border as success feedback, reusing the .qq-flash class
            cell.classList.remove('qq-flash');
            void cell.offsetWidth; // force a reflow so rapid clicks can re-trigger it
            cell.classList.add('qq-flash');
            setTimeout(() => cell.classList.remove('qq-flash'), 600);
          },
          () => toast('Copy failed')
        );
      });

      cell.querySelector('.qq-del-btn').addEventListener('click', () => {
        const i = Number(cell.dataset.idx);
        items.splice(i, 1);
        saveItems();
        updateBadge();
        render();
      });

      // ---- Drag: pointerdown takes over, move/up go through document-level listeners (cleaned up in cleanupDrag) ----
      const handle = cell.querySelector('.qq-drag-handle');
      handle.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;       // only accept the left button / primary pointer
        e.preventDefault();
        startDrag(Number(cell.dataset.idx), cell, e);
      });

      $body.appendChild(cell);
    });
  }

  function addCell(focusIt) {
    items.push('');
    saveItems();
    updateBadge();
    render();
    if (focusIt) {
      requestAnimationFrame(() => {
        const tas = $body.querySelectorAll('textarea');
        if (tas.length) {
          const last = tas[tas.length - 1];
          last.focus();
          last.scrollIntoView({ block: 'nearest' });
        }
      });
    }
  }

  function openQueue() {
    // On first open (empty queue), auto-add one empty cell to save a +Add click
    if (items.length === 0) {
      items.push('');
      // Don't saveItems — avoid polluting localStorage; persist only after the user types something
    }
    render();
    overlay.classList.add('open');
    requestAnimationFrame(() => {
      const tas = $body.querySelectorAll('textarea');
      if (tas.length) {
        const target = tas[tas.length - 1];
        target.focus();
        const len = target.value.length;
        target.setSelectionRange(len, len);
      }
    });
  }

  function closeQueue() {
    overlay.classList.remove('open');
  }

  fab.addEventListener('click', openQueue);
  $closeBtn.addEventListener('click', closeQueue);
  $addBtn.addEventListener('click', () => addCell(true));
  // Click the overlay's blank area (outside the modal) to close
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeQueue();
  });
  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeQueue(); }
  });

  updateBadge();
})();
</script>
</body>
</html>
