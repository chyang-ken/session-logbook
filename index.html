  /* Long-text soft fold: .conv-foldable is collapsed by default (shows only fold-summary); adding .open
     switches it to fold-full. .fold-hint is the middle-hint style for "⋯ N chars hidden ⋯".
     The whole block has cursor:pointer to hint it's clickable; on hover it shifts color slightly to reinforce clickability. */
  .conv-foldable { cursor: pointer; }
  .conv-foldable .fold-full { display: none; }
  .conv-foldable.open .fold-summary { display: none; }
  .conv-foldable.open .fold-full { display: block; }
  .conv-foldable.open { cursor: pointer; }  /* still clickable to collapse after expanding */
  .fold-summary {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .fold-hint {
    display: inline-block;
    margin: 0 4px;
    padding: 0 6px;
    color: var(--text-4);
    font-style: italic;
    font-size: 11px;
    background: rgba(var(--role-system-rgb), 0.08);
    border-radius: 3px;
    user-select: none;
  }
  .conv-foldable:hover .fold-hint {
    background: rgba(var(--role-system-rgb), 0.18);
    color: var(--text-3);
  }

  /* Scope visibility filter: unchecking one side's checkbox hides that bucket's turns entirely.
     Find search reuses the same checkbox group — TreeWalker automatically skips display:none nodes,
     so the search scope is also controlled by the same toggles; one control governs two things.
     The selector is .conv-overlay rather than #conv: the modal root element has className='conv-overlay',
     and the standalone popout is the same element (shared via ensureConvOverlay), so no separate ruleset is needed. */
  .conv-overlay.hide-user-bucket .conv-user { display: none; }
  .conv-overlay.hide-asst-bucket .conv-assistant,
  .conv-overlay.hide-asst-bucket .conv-skill,
  .conv-overlay.hide-asst-bucket .conv-qa,
  .conv-overlay.hide-asst-bucket .conv-tools,
  .conv-overlay.hide-asst-bucket .conv-subagent-spawn,
  .conv-overlay.hide-asst-bucket .conv-system-event { display: none; }

  /* QA (AskUserQuestion) — collapsed-state conversation subtype; its purple tone stands alongside user/assistant as a third pillar */
  .conv-qa { background: rgba(var(--role-qa-rgb),0.07); }
  .conv-qa .conv-role { color: var(--role-qa-fg); }
  .conv-qa-question {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(var(--role-qa-rgb),0.25);
  }
  .conv-qa-question:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .conv-qa-q-text {
    font-size: 13px; font-weight: 600; color: var(--text-1);
    margin-bottom: 6px; line-height: 1.55;
  }
  .conv-qa-options {
    list-style: none; padding: 0; margin: 0 0 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .conv-qa-option {
    font-size: 12px; color: var(--text-2); line-height: 1.55;
    padding: 3px 8px; border-radius: 4px;
  }
  .conv-qa-option.selected {
    background: rgba(var(--role-qa-rgb),0.12); color: var(--text-1); font-weight: 500;
  }
  .conv-qa-option-letter {
    font-family: var(--font-mono); font-size: 11px; color: var(--role-qa-fg);
    font-weight: 600; margin-right: 6px;
  }
  .conv-qa-option-desc {
    font-size: 11px; color: var(--text-3);
    margin: 2px 0 0 28px; line-height: 1.5;
  }
  .conv-qa-option-preview {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3); background: rgba(0,0,0,0.04);
    padding: 6px 10px; border-radius: 4px;
    margin: 4px 0 0 28px;
    white-space: pre; overflow-x: auto;
  }
  .conv-qa-answer {
    font-size: 13px; color: var(--text-1); font-weight: 500;
    padding: 6px 10px; background: rgba(var(--role-qa-rgb),0.10);
    border-radius: 4px; margin-top: 4px;
    white-space: pre-wrap; word-break: break-word;
  }
  .conv-qa-answer-empty { color: var(--text-4); font-style: italic; font-weight: 400; }
  /* Other free-text = the user's most important correction signal; higher contrast, add a tag */
  /* Other free-text is still the most important correction signal: keep the strong background + tag emphasis (drop the 3px side bar; emphasis doesn't rely on the side bar) */
  .conv-qa-answer-other {
    background: rgba(var(--role-skill-rgb), 0.14);
    color: var(--text-1);
  }
  .conv-qa-other-tag {
    display: inline-block; font-family: var(--font-mono);
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--role-skill-fg); background: rgba(var(--role-skill-rgb), 0.25);
    padding: 1px 6px; border-radius: 3px;
    margin-right: 8px; vertical-align: middle;
  }

  .conv-text {
    font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .conv-text.md { white-space: normal; }
  /* Raw mode: don't render markdown, show source text in monospace (pre-wrap is provided by .conv-text,
     preserving line breaks and indentation). Color is still given by the role rules below (the user/assistant distinction is unchanged). */
  .conv-text.raw {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
  }
  .conv-user .conv-text { color: var(--text-1); font-weight: 500; }
  .conv-assistant .conv-text { color: var(--text-2); }

  /* Markdown rendered content */
  .conv-text.md p { margin: 0 0 6px; }
  .conv-text.md p:last-child { margin-bottom: 0; }
  .conv-text.md h1, .conv-text.md h2, .conv-text.md h3,
  .conv-text.md h4, .conv-text.md h5 {
    font-weight: 600; margin: 10px 0 4px; line-height: 1.3;
  }
  .conv-text.md h1 { font-size: 16px; }
  .conv-text.md h2 { font-size: 14px; }
  .conv-text.md h3 { font-size: 13px; }
  .conv-text.md ul, .conv-text.md ol { padding-left: 18px; margin: 4px 0; }
  .conv-text.md li { margin: 2px 0; }
  .conv-text.md code {
    font-family: var(--font-mono); font-size: 11px;
    background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px;
  }
  .conv-text.md pre {
    background: rgba(0,0,0,0.05); padding: 10px 14px;
    border-radius: 6px; overflow-x: auto; margin: 6px 0;
  }
  .conv-text.md pre code { background: none; padding: 0; font-size: 12px; }
  .conv-text.md blockquote {
    border-left: 3px solid var(--border); padding-left: 12px;
    color: var(--text-3); margin: 4px 0;
  }
  .conv-text.md table {
    border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px;
  }
  .conv-text.md th, .conv-text.md td {
    border: 1px solid var(--border); padding: 5px 10px; text-align: left;
  }
  .conv-text.md th { background: rgba(0,0,0,0.04); font-weight: 600; }
  .conv-text.md a { color: var(--accent); }
  .conv-text.md strong { font-weight: 600; }
  .conv-text.md hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

  /* Tool group — minimalist: tool calls are background detail while reading, demoted to the lowest visual weight.
     Drop the 3px purple side bar + drop the colored tint, keeping only a 1px neutral border to group them; the visual budget goes back to the conversation body. */
  .conv-tools {
    margin: 4px 0 8px;
    border: 1px solid var(--border-light);
    border-radius: 6px; overflow: hidden;
    background: transparent;
  }
  .conv-assistant + .conv-tools { margin-top: -4px; }

  .conv-tool { border-bottom: 1px solid var(--border-light); }
  .conv-tool:last-child { border-bottom: none; }

  .conv-tool-head {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px; background: transparent;
    cursor: pointer; user-select: none;
    font-family: var(--font-mono); font-size: 12px;
    transition: background 0.15s;
  }
  .conv-tool-head:hover { background: var(--bg-hover); }
  .conv-tool-caret {
    color: var(--text-4); font-size: 9px;
    transition: transform 0.15s; flex-shrink: 0; width: 10px;
  }
  .conv-tool.open .conv-tool-caret { transform: rotate(90deg); }
  /* Minimalist: tool names drop the purple, using neutral dark gray + monospace bold for legibility (error states are still marked rust, see below) */
  .conv-tool-name { color: var(--text-2); font-weight: 600; flex-shrink: 0; }
  .conv-tool-summary {
    color: var(--text-3); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .conv-tool-error .conv-tool-name { color: var(--rust); }

  .conv-tool-body {
    display: none; padding: 8px 12px;
    border-top: 1px solid var(--border-light);
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3); line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
    max-height: 400px; overflow-y: auto;
    background: var(--bg-card);
  }
  .conv-tool.open .conv-tool-body { display: block; }

  @keyframes section-reveal {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* The entrance animation runs only once on "first load": render() adds .anim-in to #list and removes it after one frame.
     Live polling triggers a full-page innerHTML rebuild every few seconds; if .section carried this animation unconditionally, it would replay the
     fade-in-and-rise each cycle → the whole list flickers on a timer. Scoping to .anim-in means rebuilds no longer replay it. */
  #list.anim-in .section { animation: section-reveal 0.4s ease both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  /* Single-column breakpoint: below this width, the two-column layout starves the right column (default 42.5%) down to ~340px,
     where the card footer row (sid+time+actions) and group-header buttons no longer fit and get clipped.
     960px guarantees the narrow column is ≥ ~370px in two-column mode; any narrower switches to single-column full width. */
  @media (max-width: 960px) {
    main { flex-direction: column; gap: 24px; height: auto; }
    .col-left, .col-right { flex: 1 1 auto; overflow-y: visible; }
    .col-left { flex-basis: auto; }
    .col-divider { display: none; }
    .page-head { padding: 10px 16px; flex-wrap: wrap; }
  }
  /* The top bar doesn't fit below ~656px (search has hit its min-width yet still pushes out refresh).
     Promote search to a full-width input on its own row, leaving filter/toggles/count/refresh on another row. */
  @media (max-width: 680px) {
    .page-head { row-gap: 10px; column-gap: 12px; }
    .search-wrap { order: -1; flex-basis: 100%; min-width: 0; }
  }
</style>
</head>
<body>
<header class="page-head">
  <div class="source-filter" id="source-filter" data-open="false">
    <button class="source-filter-trigger" id="source-filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span id="source-filter-label">All Sessions</span>
      <span class="source-filter-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    </button>
    <div class="source-filter-menu" role="listbox" id="source-filter-menu">
      <div class="source-filter-option" role="option" data-value="all">All Sessions</div>
      <div class="source-filter-option" role="option" data-value="claude">Claude only</div>
      <div class="source-filter-option" role="option" data-value="codex">Codex only</div>
      <div class="source-filter-option" role="option" data-value="antigravity">Antigravity only</div>
    </div>
  </div>
  <div class="search-wrap" id="search-wrap">
    <input class="search" id="search" placeholder="Full-text search · multiple words = AND · supports session ID">
    <span class="search-spinner" aria-hidden="true"></span>
    <button class="search-clear" id="search-clear" type="button" title="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <label class="oneshot-toggle" title="Hide single-turn sessions (typical claude -p noise)">
    <input type="checkbox" id="hide-oneshot">
    <span>Hide 1-round</span>
  </label>
  <span class="live-dot" id="live-dot" data-tooltip="Live — auto-refreshing"></span>
  <span class="count" id="count">—</span>
  <button class="refresh-btn" id="collapse-all" type="button" title="Collapse all cards" aria-label="Collapse all cards"></button>
  <button class="refresh-btn" id="refresh" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
</header>
<main id="list"></main>
<div class="toast" id="toast"></div>

<script>
const SECTION_ORDER = ['starred', 'recent', 'dusty', 'archived'];
const SECTION_LABELS = {
  starred:  {title: 'Starred'},
  recent:   {title: 'Recent'},
  dusty:    {title: 'Dusty'},
  archived: {title: 'Archived'},
};
const SECTION_DEFAULT_OPEN = {
  starred: true, recent: true, dusty: false, archived: false,
};

// ---------- localStorage persistence ----------
const LS_KEY = 'session-logbook-ui';

function loadUIState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}

function saveUIState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      sectionOpen: [...state.sectionOpen],
      sectionClosed: [...state.sectionClosed],
      groupOpen: [...state.groupOpen],
      groupClosed: [...state.groupClosed],
      cardCollapsed: [...state.cardCollapsed],
      cardExpanded: [...state.cardExpanded],
      q: state.q,
      recentDays: state.recentDays,
      sourceFilter: state.sourceFilter,
      colLeftPct: state.colLeftPct,
      hideOneshot: state.hideOneshot,
    }));
  } catch {}
}

// Prune session ids that no longer exist from the two collapse-override Sets (after a session is deleted/archived its id still lingers,
// otherwise the Sets only grow and localStorage accumulates dead ids forever). Calling it once after the initial load is enough.
function pruneCardCollapsed() {
  if (!state.items.length) return;
  const live = new Set(state.items.map(m => m.id));
  let changed = false;
  for (const set of [state.cardCollapsed, state.cardExpanded]) {
    for (const id of [...set]) {
      if (!live.has(id)) { set.delete(id); changed = true; }
    }
  }
  if (changed) saveUIState();
}

const _saved = loadUIState();

// Recent slice thresholds: 7 / 14 / 21 days, or 'all' (unbounded — everything not archived/starred goes into recent)
const RECENT_DAYS_OPTIONS = [7, 14, 21, 'all'];
const recentDaysChipLabel = d => d === 'all' ? 'All time' : `Last ${d} days`;
const recentDaysOptionLabel = d => d === 'all' ? 'All time' : `${d} days`;
const SOURCE_FILTER_VALUES = ['all', 'claude', 'codex', 'antigravity'];

const state = {
  q: _saved?.q || '',
  items: [],
  searchHits: {},    // session_id -> [{text, role, term}, ...]
  searchPending: false,
  sectionOpen: _saved
    ? new Set(_saved.sectionOpen)
    : new Set(Object.entries(SECTION_DEFAULT_OPEN).filter(([, v]) => v).map(([k]) => k)),
  sectionClosed: _saved ? new Set(_saved.sectionClosed) : new Set(),
  groupOpen: _saved ? new Set(_saved.groupOpen) : new Set(),
  groupClosed: _saved ? new Set(_saved.groupClosed) : new Set(),
  // Card collapse overrides (per-section compromise): cardCollapsed=force collapsed, cardExpanded=force expanded; the default is decided by scope.
  // Old data only had cardCollapsed; backward compatible (still treated as "force collapsed"). Persisted by id across refreshes.
  cardCollapsed: _saved ? new Set(_saved.cardCollapsed || []) : new Set(),
  cardExpanded: _saved ? new Set(_saved.cardExpanded || []) : new Set(),
  recentDays: RECENT_DAYS_OPTIONS.includes(_saved?.recentDays) ? _saved.recentDays : 7,
  // Left column width percentage; null means follow the CSS default (57.5%); a number is written after the user drags
  colLeftPct: typeof _saved?.colLeftPct === 'number' ? _saved.colLeftPct : null,
  // Hide single-turn sessions (typical claude -p noise), default true
  hideOneshot: typeof _saved?.hideOneshot === 'boolean' ? _saved.hideOneshot : true,
  // Source filter (all | claude | codex | antigravity)
  sourceFilter: SOURCE_FILTER_VALUES.includes(_saved?.sourceFilter) ? _saved.sourceFilter : 'all',
};

// Column width bounds and default value
const COL_LEFT_PCT_MIN = 25;
const COL_LEFT_PCT_MAX = 75;
const COL_LEFT_PCT_DEFAULT = 57.5;

function applyColLeftPct() {
  const $main = document.querySelector('main');
  if (!$main) return;
  if (state.colLeftPct == null) {
    $main.style.removeProperty('--col-left-pct');
  } else {
    $main.style.setProperty('--col-left-pct', state.colLeftPct + '%');
  }
}

const $list = document.getElementById('list');
const $count = document.getElementById('count');
const $search = document.getElementById('search');
const $searchWrap = document.getElementById('search-wrap');
const $searchClear = document.getElementById('search-clear');
const $toast = document.getElementById('toast');

// Normalize a cwd path to its "true project root": strip the worktree suffix.
// - /foo/bar/.worktrees/feat          → /foo/bar
// - /foo/bar/.claude/worktrees/feat   → /foo/bar
function stripWorktree(p) {
  if (!p) return p;
  // Use .+ rather than [^/]+: when the worktree is already deleted, the server's fallback naive decoding may split a branch name (e.g. query-queue)
  // into multiple levels (query/queue), but everything after .claude/worktrees/ must belong to the same worktree, so strip the whole segment together.
  return p
    .replace(/\/\.worktrees\/.+$/, '')
    .replace(/\/\.claude\/worktrees\/.+$/, '');
}

// Convert a worktree-stripped path into a two-level display key:
// - /Users/alice                           → ~
// - /Users/alice/side-project           → side-project
// - /Users/alice/webapp/teamBrain           → webapp/teamBrain
// - /Users/alice/a/b/c                     → b/c   (take only the last two levels)
// - /other/path                               → path  (non-home paths also get at most two levels)
// "No workspace" group name: the session is not bound to any project (e.g. Antigravity pure web research/chat — Antigravity
// itself records "user does not have any active workspace" in its .db). A state common across tools,
// distinct from "parse failed/unknown" — here it's "genuinely none". renderGroup adds styling based on this name for visual distinction.
const NO_WORKSPACE_KEY = 'No workspace';

function projectKey(p) {
  const clean = stripWorktree(p);
  if (!clean) return NO_WORKSPACE_KEY;

  // Strip the home prefix to get the path relative to home
  const homeMatch = clean.match(/^(\/(?:Users|home)\/[^/]+)(\/.*)?$/);
  let rel;
  if (homeMatch) {
    rel = homeMatch[2] ? homeMatch[2].replace(/^\//, '') : '';
    if (!rel) return '~';  // the session itself is directly under home
  } else {
    rel = clean.replace(/^\//, '');
  }

  const parts = rel.split('/').filter(Boolean);
  if (parts.length === 0) return '(root)';
  if (parts.length === 1) return parts[0];
  return parts.slice(-2).join('/');
}

let _toastTimer = null;
// toast(msg) or toast(msg, {action:{label, fn}}). With an action, the toast is clickable and stays longer (undo window).
function toast(msg, opts = {}) {
  clearTimeout(_toastTimer);
  const action = opts.action;
  if (action) {
    $toast.innerHTML = `<span class="toast-msg"></span><button class="toast-action" type="button"></button>`;
    $toast.querySelector('.toast-msg').textContent = msg;
    const btn = $toast.querySelector('.toast-action');
    btn.textContent = action.label;
    btn.onclick = () => { $toast.classList.remove('show'); try { action.fn(); } catch {} };
    $toast.classList.add('has-action');
  } else {
    $toast.textContent = msg;
    $toast.classList.remove('has-action');
  }
  $toast.classList.add('show');
  _toastTimer = setTimeout(() => $toast.classList.remove('show'), action ? 5000 : 1400);
}

// For the Files modal path tabs: the main repo first, worktrees in alphabetical order
function sortGroupPaths(paths) {
  return paths.slice().sort((a, b) => {
    const aWt = /\/\.claude\/worktrees\/|\/\.worktrees\//.test(a);
    const bWt = /\/\.claude\/worktrees\/|\/\.worktrees\//.test(b);
    if (aWt !== bWt) return aWt ? 1 : -1;
    return a.localeCompare(b);
  });
}

// Tab label: worktrees show the suffix name; the main repo shows the project-root basename
function pathTabLabel(p) {
  const m = p.match(/\/\.claude\/worktrees\/([^/]+)|\/\.worktrees\/([^/]+)/);
  if (m) return m[1] || m[2];
  const parts = p.replace(/\/$/, '').split('/');
  return parts[parts.length - 1] || p;
}

function relTime(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  const diff = (Date.now() - t) / 1000;
  if (diff < 60) return Math.round(diff) + 's ago';
  if (diff < 3600) return Math.round(diff / 60) + 'm ago';
  if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
  if (diff < 86400 * 30) return Math.round(diff / 86400) + 'd ago';
  return new Date(iso).toISOString().slice(0, 10);
}

// Absolute time for the detail area: local timezone, formatted to the minute (conv-detail previously dumped raw ISO with microseconds + timezone, hard to read)
function fmtAbsTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function highlightTerms(escapedText, query) {
  if (!query) return escapedText;
  const terms = query.split(/\s+/).filter(Boolean);
  let result = escapedText;
  for (const term of terms) {
    // Highlight within the escaped text (the term itself must also be escaped to match correctly)
    const safeTerm = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    result = result.replace(new RegExp(safeTerm, 'gi'), '<mark>$&</mark>');
  }
  return result;
}

function groupItems(items) {
  const now = Date.now() / 1000;
  const dayAgo = now - 86400;
  const groups = new Map();
  for (const m of items) {
    const key = projectKey(m.project_path);
    if (!groups.has(key)) {
      groups.set(key, {
        key, paths: new Set(), items: [],
        mostRecent: 0, recentCount: 0,
      });
    }
    const g = groups.get(key);
    g.paths.add(m.project_path || NO_WORKSPACE_KEY);
    g.items.push(m);
    if (m.mtime > g.mostRecent) g.mostRecent = m.mtime;
    if (m.mtime >= dayAgo) g.recentCount += 1;
  }
  return [...groups.values()].sort((a, b) => b.mostRecent - a.mostRecent);
}

function shouldAutoExpand(scope, g) {
  if (scope === 'starred') return true;       // Starred: expand all
  if (scope === 'recent' && g.recentCount > 0) return true;  // Within Recent, expand those active in the last 24h
  return false;                                // Dusty / Archived both default to collapsed
}

// ---------- Card collapse: per-section default + dual-Set override (the minimalist "per-section compromise") ----------
// Recent (the main working surface) defaults to expanded; the other sections (Starred/Dusty/Archived) default to collapsed — the scanning surface returns to "many at a glance".
// The user's explicit choices are recorded as overrides via two Sets: cardCollapsed=force collapsed, cardExpanded=force expanded.
// Dual Sets (rather than a single Set XOR) keep "explicit collapse/expand" semantically stable when a session changes section, and aging into Dusty auto-collapses.
function cardDefaultCollapsed(scope) {
  return (scope || 'recent') !== 'recent';
}
function cardIsCollapsed(m) {
  if (state.cardCollapsed.has(m.id)) return true;
  if (state.cardExpanded.has(m.id)) return false;
  return cardDefaultCollapsed(m.scope);
}
function setCardCollapsed(id, scope, collapsed) {
  state.cardCollapsed.delete(id);
  state.cardExpanded.delete(id);
  if (collapsed !== cardDefaultCollapsed(scope)) {
    (collapsed ? state.cardCollapsed : state.cardExpanded).add(id);
  }
}

function renderDots(count) {
  if (!count) return '';
  const n = Math.min(count, 3);
  const dots = '●'.repeat(n);
  return `<span class="group-dots" title="${count} session(s) in last 24h">${dots}</span>`;
}

function bucketByScope(items) {
  const buckets = {starred: [], recent: [], dusty: [], archived: []};
  for (const m of items) {
    const s = m.scope || 'recent';
    (buckets[s] || buckets.recent).push(m);
  }
  return buckets;
}

// The frontend re-derives scope from state.recentDays, overriding the value the backend sent.
// The priority matches the backend's compute_scope: archived > starred > mtime-based.
function computeScope(m) {
  if (m.archived) return 'archived';
  if (m.starred) return 'starred';
  if (state.recentDays === 'all') return 'recent';
  const ageDays = (Date.now() / 1000 - m.mtime) / 86400;
  return ageDays < state.recentDays ? 'recent' : 'dusty';
}

function applyAllScopes() {
  for (const m of state.items) m.scope = computeScope(m);
}

function renderRecentDaysSelector() {
  return `<div class="recent-days-wrap" data-recent-days>
    <button type="button" class="recent-days-chip" data-recent-trigger aria-expanded="false" aria-haspopup="true" title="Adjust Recent window">
      ${recentDaysChipLabel(state.recentDays)}
      <span class="chip-caret">${ICONS.chevronDown}</span>
    </button>
    <div class="recent-days-popover" data-recent-popover hidden role="menu">${
      RECENT_DAYS_OPTIONS.map(d =>
        `<button type="button" data-days="${d}" role="menuitem" class="${d === state.recentDays ? 'active' : ''}">${recentDaysOptionLabel(d)}</button>`
      ).join('')
    }</div>
  </div>`;
}

// The set of sessions the dashboard actually displays right now: source filter → search → hideOneshot, the same pipeline as render.
// Extracted so "collapse all" can operate over the full dataset — including cards inside unexpanded groups that aren't currently rendered to the DOM.
function displayedItems() {
  const scopedItems = state.sourceFilter === 'all'
    ? state.items
    : state.items.filter(m => (m.source || 'claude') === state.sourceFilter);
  const q = state.q.toLowerCase();
  let filtered = q ? scopedItems.filter(m => m.id in state.searchHits) : scopedItems;
  if (state.hideOneshot) filtered = filtered.filter(m => m.user_turn_count !== 1);
  return { scopedItems, filtered };
}

let _hasRendered = false;  // The entrance animation runs only once: true on the first frame, after which all renders (including live polling) no longer replay it
function render() {
  // Entrance animation gate: only the first render attaches .anim-in to #list (making section-reveal take effect);
  // subsequent rebuilds (live polling / user actions) remove the class → no replay, eliminating the timed flicker.
  $list.classList.toggle('anim-in', !_hasRendered);
  _hasRendered = true;

  // The unified filtering pipeline for source filter / search / hideOneshot (see displayedItems).
  // state.items stays unchanged (still everything the backend returned), avoiding data loss when switching.
  const { scopedItems, filtered } = displayedItems();

  if (scopedItems.length === 0) {
    $count.textContent = '0 sessions';
    if (state.items.length === 0) {
      // Truly zero sessions (first use / completely empty): teach + point to the real workflow, not a cold "No sessions match"
      $list.innerHTML = `<div class="empty"><div class="empty-title">No sessions yet</div><div class="empty-hint">Start a Claude / Codex session in the CLI and it will appear here automatically.</div></div>`;
    } else {
      // The source filter filtered them all out: give a one-click way back to all (not a dead end)
      $list.innerHTML = `<div class="empty"><div class="empty-title">No ${escapeHtml(state.sourceFilter)} sessions</div><button class="empty-action" id="empty-show-all">Show all sources</button></div>`;
      document.getElementById('empty-show-all')?.addEventListener('click', () => {
        state.sourceFilter = 'all'; syncSourceFilterUI(); saveUIState(); render();
      });
    }
    return;
  }

  // Recompute scope before every render; scope is a frontend-derived quantity
  applyAllScopes();

  const q = state.q.toLowerCase();

  // No search results: a dedicated empty state, echoing the query term + one-click clear (distinguishing "nothing found" from "didn't search")
  if (state.q && filtered.length === 0) {
    $count.textContent = '0 / ' + scopedItems.length + ' sessions';
    $list.innerHTML = `<div class="empty"><div class="empty-title">No matches for “${escapeHtml(state.q)}”</div><button class="empty-action" id="empty-clear-search">Clear search</button></div>`;
    document.getElementById('empty-clear-search')?.addEventListener('click', () => {
      $search.value = ''; syncSearchClear(); $search.dispatchEvent(new Event('input')); $search.focus();
    });
    return;
  }

  if (filtered.length === scopedItems.length) {
    $count.textContent = scopedItems.length + ' sessions';
  } else {
    $count.textContent = filtered.length + ' / ' + scopedItems.length + ' sessions';
  }

  const buckets = bucketByScope(filtered);
  const searching = q.length > 0;

  const renderScopes = (scopes) => scopes.map(scope => {
    const bucketItems = buckets[scope];
    const open = searching
      ? !state.sectionClosed.has(scope)
      : state.sectionOpen.has(scope);
    return renderSection(scope, bucketItems, open, searching);
  }).join('');

  // Save the scroll position (innerHTML destroys the column elements, resetting scroll to zero)
  const oldLeft = $list.querySelector('.col-left');
  const oldRight = $list.querySelector('.col-right');
  const scrollLeft = oldLeft ? oldLeft.scrollTop : 0;
  const scrollRight = oldRight ? oldRight.scrollTop : 0;

  $list.innerHTML = `
    <div class="col col-left">${renderScopes(['recent'])}</div>
    <div class="col-divider" id="col-divider" title="Drag to resize columns, double-click to reset"></div>
    <div class="col col-right">${renderScopes(['starred', 'dusty', 'archived'])}</div>
  `;

  // Restore the scroll position
  const newLeft = $list.querySelector('.col-left');
  const newRight = $list.querySelector('.col-right');
  if (newLeft) newLeft.scrollTop = scrollLeft;
  if (newRight) newRight.scrollTop = scrollRight;

  bindSectionEvents();
  bindGroupEvents();
  bindCardEvents();
  bindDividerEvents();
  syncCollapseAllBtn();
}

// ---------- Global collapse / expand ----------
// chevrons-up = collapse all; chevrons-down = expand all (feather)
const _CHEVRONS_UP = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>';
const _CHEVRONS_DOWN = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>';

// Refresh the global button based on "all currently displayed sessions" (not just the rendered DOM): all collapsed → show "expand all", otherwise "collapse all".
// Using data rather than the DOM, cards inside unexpanded groups also count (otherwise their state can't propagate and you'd have to collapse each one after expanding).
function syncCollapseAllBtn() {
  const btn = document.getElementById('collapse-all');
  if (!btn) return;
  const { filtered } = displayedItems();
  if (filtered.length === 0) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  const allCollapsed = filtered.every(m => cardIsCollapsed(m));
  btn.dataset.mode = allCollapsed ? 'expand' : 'collapse';
  btn.innerHTML = allCollapsed ? _CHEVRONS_DOWN : _CHEVRONS_UP;
  const label = allCollapsed ? 'Expand all cards' : 'Collapse all cards';
  btn.title = label;
  btn.setAttribute('aria-label', label);
}

function bindCollapseAllBtn() {
  const btn = document.getElementById('collapse-all');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const expand = btn.dataset.mode === 'expand';
    const collapsed = !expand;
    // Expand/collapse all: explicitly set an override on every displayed card (including cards inside collapsed groups that aren't rendered into the DOM).
    // Goes through setCardCollapsed to maintain the dual Sets, consistent with the section default (cards that exactly match the default write no override, auto-pruning id buildup).
    for (const m of displayedItems().filtered) setCardCollapsed(m.id, m.scope, collapsed);
    // Don't go through render() — same feel as single-card collapse, avoids full-column reflow / scroll jump.
    // Directly toggle the class on rendered cards; the state of unrendered cards is already written to state, and render() applies it when their group expands.
    document.querySelectorAll('.card[data-id]').forEach(card => {
      card.classList.toggle('collapsed', collapsed);
      const cb = card.querySelector('[data-act="collapse"]');
      if (cb) cb.dataset.tooltip = collapsed ? 'Expand card' : 'Collapse card';
    });
    saveUIState();
    syncCollapseAllBtn();
  });
}

// ---------- Column width drag ----------
function bindDividerEvents() {
  const divider = document.getElementById('col-divider');
  if (!divider) return;

  divider.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const $main = document.querySelector('main');
    if (!$main) return;
    document.body.classList.add('col-dragging');

    let pendingPct = null;
    let rafHandle = 0;

    const onMove = (ev) => {
      const rect = $main.getBoundingClientRect();
      // Subtract padding: getBoundingClientRect includes padding, and main's left padding is 28px
      const pct = ((ev.clientX - rect.left - 28) / (rect.width - 56)) * 100;
      pendingPct = Math.max(COL_LEFT_PCT_MIN, Math.min(COL_LEFT_PCT_MAX, pct));
      if (rafHandle) return;
      rafHandle = requestAnimationFrame(() => {
        rafHandle = 0;
        $main.style.setProperty('--col-left-pct', pendingPct + '%');
      });
    };

    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('col-dragging');
      if (rafHandle) cancelAnimationFrame(rafHandle);
      if (pendingPct != null) {
        state.colLeftPct = Math.round(pendingPct * 10) / 10;
        saveUIState();
      }
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Double-click resets to default
  divider.addEventListener('dblclick', () => {
    state.colLeftPct = null;
    applyColLeftPct();
    saveUIState();
    toast(`Column width reset (${COL_LEFT_PCT_DEFAULT}%)`);
  });
}

function renderSection(scope, items, open, searching) {
  const {title} = SECTION_LABELS[scope];
  // A2 pulls the "time-decay threshold" from the docs onto the UI: the Dusty title carries the currently active N-day entry line,
  // which updates here when recentDays changes, making the causal link between the recentDays switcher and Dusty visible.
  const titleNote = (scope === 'dusty' && typeof state.recentDays === 'number')
    ? `<span class="section-title-note">${state.recentDays}d+</span>` : '';
  const count = items.length;
  let body;
  if (count === 0) {
    // Give the section empty state a line too: an empty Starred is an invitation (a teaching moment), not a dead end
    const hint = scope === 'starred' ? 'Star a session to pin it here'
               : scope === 'archived' ? 'Archived sessions land here'
               : '— nothing —';
    body = `<div class="section-empty">${hint}</div>`;
  } else {
    const groups = groupItems(items);
    body = groups.map(g => renderGroup(g, scope, searching)).join('');
  }
  const countLabel = count === 0
    ? '·'
    : `${count}${count === 1 ? ' session' : ' sessions'}`;
  const selector = scope === 'recent' ? renderRecentDaysSelector() : '';
  return `
    <div class="section ${scope} ${open ? 'open' : ''}" data-section="${scope}">
      <div class="section-header" data-section-toggle>
        <span class="section-caret">${ICONS.chevron}</span>
        <span class="section-title">${title}</span>${titleNote}
        ${selector}
        <span class="section-count">${countLabel}</span>
      </div>
      <div class="section-body">${body}</div>
    </div>`;
}

function bindSectionEvents() {
  document.querySelectorAll('.section').forEach(el => {
    const scope = el.dataset.section;
    // Recent slice threshold switcher: chip triggers the popover, clicking outside closes it; stops propagation to the section toggle
    el.querySelectorAll('[data-recent-days]').forEach(wrap => {
      const trigger = wrap.querySelector('[data-recent-trigger]');
      const popover = wrap.querySelector('[data-recent-popover]');
      if (!trigger || !popover) return;
      let outsideHandler = null;
      const closePopover = () => {
        popover.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
        if (outsideHandler) {
          document.removeEventListener('click', outsideHandler, true);
          outsideHandler = null;
        }
      };
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!popover.hidden) { closePopover(); return; }
        popover.hidden = false;
        trigger.setAttribute('aria-expanded', 'true');
        outsideHandler = (ev) => {
          if (wrap.contains(ev.target)) return;
          // Intercept this outside click in the capture phase to avoid triggering unrelated actions like section collapse / card open
          ev.stopPropagation();
          ev.preventDefault();
          closePopover();
        };
        // Bind on a delay to avoid this very click; only click(capture) can truly swallow the outside click
        setTimeout(() => document.addEventListener('click', outsideHandler, true), 0);
      });
      popover.querySelectorAll('button[data-days]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const raw = btn.dataset.days;
          const val = raw === 'all' ? 'all' : parseInt(raw, 10);
          closePopover();
          if (!RECENT_DAYS_OPTIONS.includes(val) || val === state.recentDays) return;
          state.recentDays = val;
          saveUIState();
          render();
        });
      });
    });
    el.querySelector('[data-section-toggle]').addEventListener('click', (e) => {
      // Clicks inside the switcher should not trigger section collapse
      if (e.target.closest('[data-recent-days]')) return;
      const isOpen = el.classList.contains('open');
      if (state.q) {
        // Search mode: use sectionClosed to record the user's explicit collapse
        if (isOpen) {
          state.sectionClosed.add(scope);
        } else {
          state.sectionClosed.delete(scope);
        }
      } else {
        if (isOpen) {
          state.sectionOpen.delete(scope);
        } else {
          state.sectionOpen.add(scope);
        }
      }
      saveUIState();
      render();
    });
  });
}

function renderGroup(g, scope, searching) {
  const groupKey = `${scope}:${g.key}`;
  const userExplicitOpen = state.groupOpen.has(groupKey);
  const userExplicitClosed = state.groupClosed.has(groupKey);
  const autoExpand = shouldAutoExpand(scope, g);
  const expanded = searching
    ? !userExplicitClosed
    : userExplicitOpen
      ? true
      : userExplicitClosed
        ? false
        : autoExpand;
  const recentIso = new Date(g.mostRecent * 1000).toISOString();
  const pathsTitle = [...g.paths].join('\n');
  const pathHint = g.paths.size > 1 ? `${g.paths.size} paths` : '';
  const dots = renderDots(g.recentCount);
  const cards = expanded ? g.items.map(renderCard).join('') : '';
  // For looking up recently modified files: pass all paths in the group (main repo / each worktree) to the modal, defaulting to the one with the latest mtime.
  // paths are URI-encoded into the attr — escapeHtml doesn't escape ", which would truncate the JSON array inside the attr.
  const filesCurrent = g.items.length ? g.items[0].project_path : '';
  const filesPaths = sortGroupPaths([...g.paths]);
  const filesPathsAttr = encodeURIComponent(JSON.stringify(filesPaths));
  return `
    <div class="group ${expanded ? 'open' : ''}" data-group-key="${escapeHtml(groupKey)}">
      <div class="group-header" data-group-toggle>
        <span class="caret">${ICONS.chevron}</span>
        <span class="group-name${g.key === NO_WORKSPACE_KEY ? ' group-name-nows' : ''}" title="${escapeHtml(pathsTitle)}">${escapeHtml(g.key)}</span>
        <span class="group-count">${g.items.length}</span>
        ${pathHint ? `<span class="group-paths" title="${escapeHtml(pathsTitle)}">${pathHint}</span>` : ''}
        ${dots}
        <span class="group-end">
          <span class="group-time">${relTime(recentIso)}</span>
          <span class="group-actions">
            ${filesCurrent ? `<button class="group-files-btn" data-group-files data-paths="${filesPathsAttr}" data-current="${escapeHtml(filesCurrent)}" data-group-name="${escapeHtml(g.key)}" data-tooltip="Recently modified files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Files</button>` : ''}
            ${scope !== 'archived' ? `<button class="group-archive-btn" data-group-archive data-tooltip="Archive all sessions in this group"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><polyline points="10 12 12 14 14 12"/></svg>Archive all</button>` : ''}
          </span>
        </span>
      </div>
      <div class="group-body">${cards}</div>
    </div>`;
}

function bindGroupEvents() {
  document.querySelectorAll('.group').forEach(el => {
    const groupKey = el.dataset.groupKey;
    if (!groupKey) return;
    const archiveBtn = el.querySelector('[data-group-archive]');
    if (archiveBtn) {
      archiveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        // groupKey format: "${scope}:${projectKey}"
        const colonIdx = groupKey.indexOf(':');
        const gkScope = groupKey.slice(0, colonIdx);
        const gkProjectKey = groupKey.slice(colonIdx + 1);
        // Find all unarchived sessions under this group.
        // scope is computed on the fly via computeScope(m) rather than reading the cached m.scope — just like projectKey, computed live,
        // upholding the "frontend scope is the source of truth" contract and avoiding stale cached values causing missed/wrong archiving.
        const toArchive = state.items.filter(m =>
          !m.archived && computeScope(m) === gkScope && projectKey(m.project_path) === gkProjectKey
        );
        if (toArchive.length === 0) { toast('Nothing to archive'); return; }
        // Optimistic update: snapshot first, then roll back precisely from the snapshot on failure (consistent with single-item toggleArchive, no computeScope recompute)
        const snapshot = toArchive.map(m => ({ m, scope: m.scope, archived: m.archived }));
        toArchive.forEach(m => { m.archived = true; m.scope = 'archived'; });
        render();
        toast(`Archiving ${toArchive.length} session${toArchive.length > 1 ? 's' : ''}…`);
        // Call the API serially, one at a time, to avoid concurrency overwhelming Python's single-threaded accept backlog
        const failed = [];
        for (const m of toArchive) {
          try {
            const res = await mutatingFetch(`/api/sessions/${encodeURIComponent(m.id)}/archive`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({archived: true}),
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
          } catch (err) {
            failed.push(m);
          }
        }
        if (failed.length) {
          // Roll back the failures: restore from the snapshot to the real pre-operation state (no scope recompute)
          const failedSet = new Set(failed);
          snapshot.forEach(s => { if (failedSet.has(s.m)) { s.m.archived = s.archived; s.m.scope = s.scope; } });
          render();
          toast(`Failed to archive ${failed.length} session(s)`);
        } else {
          const restored = snapshot;
          toast(`Archived ${toArchive.length} session${toArchive.length > 1 ? 's' : ''}`, {
            action: { label: 'Undo', fn: () => {
              restored.forEach(s => { s.m.archived = s.archived; s.m.scope = s.scope; });
              render();
              restored.forEach(s => mutatingFetch(`/api/sessions/${encodeURIComponent(s.m.id)}/archive`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({archived: false}),
              }).catch(() => {}));
            }}
          });
        }
      });
    }

    const filesBtn = el.querySelector('[data-group-files]');
    if (filesBtn) {
      filesBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const current = filesBtn.dataset.current;
        const groupName = filesBtn.dataset.groupName || '';
        let paths = [];
        try { paths = JSON.parse(decodeURIComponent(filesBtn.dataset.paths || '%5B%5D')); } catch {}
        if (current) openFilesModal(paths, current, groupName);
      });
    }

    el.querySelector('[data-group-toggle]').addEventListener('click', (e) => {
      if (e.target.closest('[data-group-archive]') || e.target.closest('[data-group-files]')) return;
      const isOpen = el.classList.contains('open');
      if (isOpen) {
        // Collapse: remove from open, add to closed
        state.groupOpen.delete(groupKey);
        state.groupClosed.add(groupKey);
      } else {
        // Expand: remove from closed, add to open
        state.groupClosed.delete(groupKey);
        state.groupOpen.add(groupKey);
      }
      saveUIState();
      render();
    });
  });
}

function renderCard(m) {
  const msgs = (m.recent_msgs || []).map(renderMsg).join('');
  const msgsBlock = msgs
    ? `<div class="msgs">${msgs}</div>`
    : `<div class="no-msgs">— no recent messages found —</div>`;
  const stopClass = m.last_stop_reason || '';
  const stopTitle = m.last_stop_reason
    ? `last stop_reason: ${m.last_stop_reason}`
    : 'no stop_reason';
  const noteBlock = m.note
    ? `<div class="note">${escapeHtml(m.note)}</div>`
    : '';
  // A2 freshness: mtime within the last 1 hour → add fresh to time-tag (more eye-catching, scannable at a glance for "which are still hot")
  const _mt = m.mtime_iso ? new Date(m.mtime_iso).getTime() : 0;
  const isFresh = _mt && (Date.now() - _mt) < 3600 * 1000;
  // D2 persistent "has a note" micro-marker (shown even in the collapsed state, not dependent on hover)
  const noteIndicator = m.note
    ? `<span class="card-has-note" data-tooltip="Has a note">${ICONS.note}</span>`
    : '';
  // Search match snippets
  const matchSnippets = state.searchHits[m.id];
  const matchBlock = matchSnippets && matchSnippets.length > 0
    ? `<div class="search-matches">${matchSnippets.map(s => {
        const role = s.role ? `<span class="search-match-role">${escapeHtml(s.role)}</span>` : '';
        return `<div class="search-match">${role}${highlightTerms(escapeHtml(s.text), state.q)}</div>`;
      }).join('')}</div>`
    : '';
  const archiveLabel = m.archived ? 'unarchive' : 'archive';
  const archiveClass = m.archived ? '' : 'btn-danger';
  const archiveIcon = m.archived ? ICONS.unarchive : ICONS.archive;
  const starLabel = m.starred ? 'unstar' : 'star';
  const titleBlock = m.custom_title
    ? `<div class="card-title" title="${escapeHtml(m.custom_title)}">${escapeHtml(m.custom_title)}</div>`
    : '';
  // The group header already shows the main repo name; the card only shows the .worktrees/<branch> suffix for worktree sessions,
  // and the main-repo card doesn't render this row (project identity is read from the group header). Unknown paths still show a placeholder.
  let pathLabel = '';
  if (!m.project_path) {
    pathLabel = NO_WORKSPACE_KEY;
  } else {
    const trunk = stripWorktree(m.project_path);
    if (trunk && m.project_path.length > trunk.length) {
      pathLabel = m.project_path.slice(trunk.length).replace(/^\//, '');

  // path row: when pathLabel is empty (i.e. a main-repo session), the whole row isn't rendered, preserving the original worktree-only display behavior.
  const pathrow = pathLabel
    ? `<div class="card-pathrow">

  // the foot row is the visual top, and floating would collide with the actions, so it's tucked into the far right of the actions instead (icon-only, saving horizontal space).
  // Adding .btn-icon makes the inline version default to 12×12, aligning with NOTE/STAR/ARCHIVE;
  // the absolute version `.card-files-btn svg` overrides it to 14×14 (higher specificity).
  const filesSvg = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
  const hasTopRow = !!titleBlock || !!pathrow;
  const filesAbsBtn = (m.project_path && hasTopRow)
    ? `<button class="card-files-btn" data-act="files" data-tooltip="Recently modified files" aria-label="Files">${filesSvg}</button>`

    ? `<button class="btn btn-files-inline" data-act="files" data-tooltip="Recently modified files" aria-label="Files">${filesSvg}</button>`
    : '';
  const SRC_CHIP = {
    codex: ['CDX', 'source-codex', 'Codex'],
    antigravity: ['AGY', 'source-antigravity', 'Antigravity'],
  };
  const [sourceCode, sourceClass, sourceTitle] = SRC_CHIP[m.source] || ['CC', 'source-claude', 'Claude Code'];
  const sourceChip = `<span class="source-chip ${sourceClass}" title="${sourceTitle}">${sourceCode}</span>`;
  const collapsed = cardIsCollapsed(m);
  const collapseBtn = `<button class="card-collapse-btn" data-act="collapse" data-tooltip="${collapsed ? 'Expand card' : 'Collapse card'}" aria-label="Toggle card collapse">${ICONS.chevron}</button>`;
  return `
    <div class="card ${m.archived ? 'archived' : ''}${collapsed ? ' collapsed' : ''}" data-id="${escapeHtml(m.id)}" data-source="${m.source || 'claude'}" data-scope="${m.scope || 'recent'}">
      ${collapseBtn}
      ${filesAbsBtn}
      ${titleBlock}
      ${pathrow}
      <div class="card-foot">
        <span class="card-sid-wrap">
          ${sourceChip}
          <span class="card-sid" data-act="copy-id" data-tooltip="Click to copy session ID">${escapeHtml(m.id)}</span>
          <button class="sid-link-btn" data-act="copy-path" data-tooltip="Copy JSONL path" aria-label="Copy JSONL path">${ICONS.link}</button>
          <button class="sid-link-btn" data-act="copy-link" data-tooltip="Copy shareable link" aria-label="Copy shareable link">${ICONS.share}</button>
        </span>
        <span class="time-tag ${stopClass}${isFresh ? ' fresh' : ''}" title="${escapeHtml(m.mtime_iso || '')}${stopTitle ? ' · ' + escapeHtml(stopTitle) : ''}">${relTime(m.mtime_iso)}</span>
        ${noteIndicator}
        <div class="card-actions">
          <button class="btn" data-act="note" data-tooltip="Edit note" aria-label="Edit note">${ICONS.note}</button>
          <button class="btn btn-star ${m.starred ? 'starred' : ''}" data-act="star" data-tooltip="${m.starred ? 'Unstar' : 'Star'}" aria-label="${m.starred ? 'Unstar' : 'Star'}">${ICONS.star}</button>
          <button class="btn ${archiveClass}" data-act="archive" data-tooltip="${m.archived ? 'Unarchive' : 'Archive'}" aria-label="${m.archived ? 'Unarchive' : 'Archive'}">${archiveIcon}</button>
          ${filesInlineBtn}
        </div>
      </div>
      ${msgsBlock}
      ${matchBlock}
      ${noteBlock}
    </div>`;
}

function renderMsg(msg) {
  let role;
  if (msg.role === 'user') role = 'user';
  else if (msg.role === 'qa') role = 'qa';
  else role = 'assistant';
  const firstCls = msg.is_first ? ' msg-first' : '';
  let roleLabel;
  if (role === 'user') roleLabel = `<span class="msg-role">you</span>`;
  else if (role === 'qa') roleLabel = `<span class="msg-role">Q&amp;A</span>`;
  else roleLabel = `<span class="msg-role"></span>`;
  return `<div class="msg msg-${role}${firstCls}">${roleLabel}<span class="msg-text">${escapeHtml(msg.text)}</span></div>`;
}

// Write operations (star/archive/note) all go through here: it maintains the in-flight count,
// so the live auto-refresh doesn't cut in and overwrite the optimistic UI while a write hasn't been persisted (see the livePoll guard).
let _inflightMutations = 0;
async function mutatingFetch(url, opts) {
  _inflightMutations++;
  try {
    return await fetch(url, opts);
  } finally {
    _inflightMutations--;
  }
}

async function toggleArchive(id, opts = {}) {
  const m = state.items.find(x => x.id === id);
  if (!m) return;
  const newArchived = !m.archived;
  const oldArchived = m.archived;
  const oldScope = m.scope;
  m.archived = newArchived;
  m.scope = computeScope(m);
  render();
  // silent: when triggered from the modal, flashCard handles the visual feedback, so no toast is stacked on top.
  // archive is the action closest to destructive → give it an Undo safety net (undo = silent toggle back, zero cost, oldScope is still around).
  if (!opts.silent) {
    if (newArchived) toast('Archived', { action: { label: 'Undo', fn: () => toggleArchive(id, {silent: true}) } });
    else toast('Unarchived');
  }
  try {
    const res = await mutatingFetch(`/api/sessions/${encodeURIComponent(id)}/archive`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({archived: newArchived}),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch (err) {
    m.archived = oldArchived;
    m.scope = oldScope;
    render();
    toast('Archive failed: ' + err.message);
  }
}

// After a modal archive: make the corresponding card on the dashboard flash for 0.6s to indicate its new position.
// Note: toggleArchive has already called render() internally, so the DOM is currently being rebuilt,
// and we need to wait until the next frame to get the new .card node.
function flashCard(id) {
  requestAnimationFrame(() => {
    const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (card) {
      card.classList.add('card-flash');
      card.scrollIntoView({behavior: 'smooth', block: 'center'});
      card.addEventListener('animationend', () => card.classList.remove('card-flash'), {once: true});
    } else {
      // Fallback: after the scope switch the card got collapsed away, so tell the user where it went
      const m = state.items.find(x => x.id === id);
      const scopeName = m ? (SECTION_LABELS[m.scope]?.title || m.scope) : '';
      toast(scopeName ? `Moved to ${scopeName}` : 'Moved');
    }
  });
}

async function toggleStar(id) {
  const m = state.items.find(x => x.id === id);
  if (!m) return;
  const newStarred = !m.starred;
  const oldStarred = m.starred;
  const oldScope = m.scope;
  m.starred = newStarred;
  m.scope = computeScope(m);
  render();
  toast(newStarred ? 'Starred' : 'Unstarred');
  try {
    const res = await mutatingFetch(`/api/sessions/${encodeURIComponent(id)}/star`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({starred: newStarred}),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch (err) {
    m.starred = oldStarred;
    m.scope = oldScope;
    render();
    toast('Star failed: ' + err.message);
  }
}

function bindCardEvents() {
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    // Whole card opens conversation, except when clicking action buttons or copy-id
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      openConversation(id);
    });
    // Collapse toggle: only toggles this card's collapsed state. Directly toggles the class (without render()) to avoid list reflow / scroll jump.
    card.querySelector('[data-act="collapse"]')?.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowCollapsed = card.classList.toggle('collapsed');
      setCardCollapsed(id, card.dataset.scope, nowCollapsed);
      const btn = e.currentTarget;
      btn.dataset.tooltip = nowCollapsed ? 'Expand card' : 'Collapse card';
      saveUIState();
      syncCollapseAllBtn();
    });
    // Copy session ID
    card.querySelector('[data-act="copy-id"]').addEventListener('click', (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(id).then(() => toast('Copied session ID'), () => toast('Copy failed'));
    });
    // Copy JSONL path (link icon), needs stopPropagation to avoid triggering the card's whole-card open
    card.querySelector('[data-act="copy-path"]')?.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = state.items.find(x => x.id === id);
      const path = m?.jsonl_path;
      if (!path) { toast('No JSONL path'); return; }
      navigator.clipboard.writeText(path).then(() => toast('Copied JSONL path'), () => toast('Copy failed'));
    });
    // Copy a shareable direct link (/?session=<id>), using location.origin to capture the current host:port
    card.querySelector('[data-act="copy-link"]')?.addEventListener('click', (e) => {
      e.stopPropagation();
      const url = `${location.origin}/?session=${encodeURIComponent(id)}`;
      navigator.clipboard.writeText(url).then(() => toast('Copied session link'), () => toast('Copy failed'));
    });
    // Files shortcut entry: uses this card's project_path as current, and all paths with the same projectKey as tabs,
    // matching the behavior of the folder header's Files btn (the modal can still switch worktree tabs).
    card.querySelector('[data-act="files"]')?.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = state.items.find(x => x.id === id);
      if (!m?.project_path) { toast('No project path'); return; }
      const key = projectKey(m.project_path);
      const pathSet = new Set();
      for (const it of state.items) {
        if (it.project_path && projectKey(it.project_path) === key) pathSet.add(it.project_path);
      }
      const paths = sortGroupPaths([...pathSet]);
      openFilesModal(paths, m.project_path, key);
    });
    card.querySelector('[data-act="archive"]').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleArchive(id);
    });
    const starBtn = card.querySelector('[data-act="star"]');
    if (starBtn) {
      starBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleStar(id);
      });
    }
    card.querySelector('[data-act="note"]').addEventListener('click', async (e) => {
      e.stopPropagation();
      const m = state.items.find(x => x.id === id);
      if (!m) return;
      const current = m.note || '';
      const next = await window.openNoteModal(current);
      if (next === null) return;
      const oldNote = m.note;
      m.note = next;
      render();
      try {
        const res = await mutatingFetch(`/api/sessions/${encodeURIComponent(id)}/note`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({note: next}),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        toast('Note saved');
      } catch (err) {
        m.note = oldNote;
        render();
        toast('Note failed: ' + err.message);
      }
    });
  });
}

// ---------- Conversation overlay ----------
let $conv = null;
let $convNav = null;       // {prev, next, gotoIndex} navigation controller for the current conversation
let _convStandalone = false;
// Raw mode: turns off markdown rendering, displaying source text (including literals like ** ` # |) in a monospace layout.
// Deliberately view-local: persisting this made Markdown appear "broken" across future sessions.
try { localStorage.removeItem('conv_raw'); } catch {}
let _convRaw = false;

function ensureConvOverlay() {
  if ($conv) return;
  $conv = document.createElement('div');
  $conv.className = 'conv-overlay';
  $conv.addEventListener('click', (e) => {
    if (_convStandalone) return;
    if (e.target === $conv) closeConversation();
  });
  document.body.appendChild($conv);
}

function openConversation(sessionId, opts = {}) {
  ensureConvOverlay();
  _convStandalone = !!opts.standalone;
  const meta = opts.standalone
    ? null  // in standalone mode the dashboard isn't loaded, so meta is inferred from the conv data after fetch
    : state.items.find(x => x.id === sessionId);
  $conv.classList.add('open');
  $conv.innerHTML = `
    <div class="conv-modal">
      <div class="conv-head">
        <div class="conv-head-top">
          <div class="conv-info">
            <div class="conv-title">Loading…</div>
          </div>
          <button class="conv-close" id="conv-close">${ICONS.close}</button>
        </div>
      </div>
      <div class="conv-body"><div class="conv-skeleton">
        <div class="skeleton-line" style="width:28%"></div>
        <div class="skeleton-line" style="width:92%"></div>
        <div class="skeleton-line" style="width:80%"></div>
        <div class="skeleton-line" style="width:44%"></div>
        <div class="skeleton-line" style="width:88%"></div>
        <div class="skeleton-line" style="width:64%"></div>
      </div></div>
    </div>`;
  $conv.querySelector('#conv-close').addEventListener('click', closeConversation);
  $convNav = null;

  fetch(`/api/sessions/${encodeURIComponent(sessionId)}/conversation`)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => renderConv(data, meta))
    .catch(err => {
      // C4 error state: explain + offer retry, not a dead end
      $conv.querySelector('.conv-body').innerHTML =
        `<div class="empty"><div class="empty-title">Couldn't load conversation</div><div class="empty-hint">${escapeHtml(err.message)}</div><button class="empty-action" id="conv-retry">Retry</button></div>`;
      $conv.querySelector('#conv-retry')?.addEventListener('click', () => openConversation(sessionId, opts));
    });
}

function closeConversation() {
  if (_convStandalone) return;  // standalone mode: close the tab via the browser
  if ($conv) $conv.classList.remove('open');
  $convNav = null;
}

// ---------- Recent files modal ----------
let $files = null;
let _filesPollTimer = null;
let _filesRoot = '';
let _filesPaths = [];
let _filesGroupName = '';
// Filename search (whole-tree fd): empty = Recent files mode, non-empty = search mode
let _filesQuery = '';
let _filesSearchDebounce = null;
// ignored toggle: default off, persisted to localStorage
let _filesIncludeIgnored = (() => {
  try { return localStorage.getItem('files_include_ignored') === '1'; } catch { return false; }
})();
const FILES_POLL_MS = 5000;

function ensureFilesOverlay() {
  if ($files) return;
  $files = document.createElement('div');
  $files.className = 'files-overlay';
  $files.addEventListener('click', (e) => {
    if (e.target === $files) closeFilesModal();
  });
  document.body.appendChild($files);
}

function openFilesModal(paths, current, groupName) {
  ensureFilesOverlay();
  _filesPaths = (paths && paths.length) ? paths : [current];
  _filesRoot = current;
  _filesGroupName = groupName || 'Recent files';
  _filesQuery = '';  // every open starts from Recent files mode
  $files.classList.add('open');
  renderFilesShell();
  refreshFilesView();
  // Focus the search box on open: the list still shows recent changes, but the cursor is ready so you can type a filename right away
  const $si = $files.querySelector('#files-search');
  if ($si) $si.focus();
  if (_filesPollTimer) clearInterval(_filesPollTimer);
  _filesPollTimer = setInterval(refreshFilesView, FILES_POLL_MS);
}

// Route by current query: empty → Recent files; non-empty → whole-tree fd search.
// poll / ignored toggle / tab switch all go through here, so both modes get 5s auto-refresh.
function refreshFilesView() {
  if (_filesQuery.trim()) fetchFindFiles();
  else fetchRecentFiles();
}

function renderFilesShell() {
  const tabsHtml = _filesPaths.length > 1 ? `
    <div class="files-tabs" id="files-tabs">
      ${_filesPaths.map(p => {
        const label = pathTabLabel(p);
        const isWt = /\/\.claude\/worktrees\/|\/\.worktrees\//.test(p);
        const kind = isWt ? 'worktree' : 'main';
        const active = p === _filesRoot ? ' active' : '';
        return `<button class="files-tab${active}" data-path="${escapeHtml(p)}" title="${escapeHtml(p)}">
          <span class="tab-kind">${kind}</span>${escapeHtml(label)}
        </button>`;
      }).join('')}
    </div>` : '';
  const toggleOn = _filesIncludeIgnored ? ' on' : '';
  const toggleChecked = _filesIncludeIgnored ? ' checked' : '';
  $files.innerHTML = `
    <div class="files-modal">
      <div class="files-head">
        <div style="flex:1; min-width:0;">
          <div class="files-title">${escapeHtml(_filesGroupName)}</div>
          <div class="files-root" id="files-root">${escapeHtml(_filesRoot)}</div>
        </div>
        <label class="files-toggle${toggleOn}" id="files-toggle" title="Show .gitignored files (still filters node_modules etc.)">
          <input type="checkbox" id="files-include-ignored"${toggleChecked}>
          ignored
        </label>
        <span class="files-meta" id="files-meta"></span>
        <button class="files-close" id="files-close">${ICONS.close}</button>
      </div>
      ${tabsHtml}
      <div class="files-search-wrap${_filesQuery.trim() ? ' has-value' : ''}" id="files-search-wrap">
        <input class="files-search" id="files-search" type="text" autocomplete="off"
               spellcheck="false" placeholder="Find file by name in this folder…  (whole-tree fd search)">
        <button class="files-search-clear" id="files-search-clear" type="button" title="Clear">${ICONS.close}</button>
      </div>
      <div class="files-body" id="files-body"><div class="files-empty">Loading…</div></div>
    </div>`;
  $files.querySelector('#files-close').addEventListener('click', closeFilesModal);
  // ignored toggle: on change, write localStorage + immediately refresh in the current mode (works for both search / recent)
  const $tog = $files.querySelector('#files-toggle');
  const $cb = $files.querySelector('#files-include-ignored');
  if ($cb && $tog) {
    $cb.addEventListener('change', () => {
      _filesIncludeIgnored = $cb.checked;
      try { localStorage.setItem('files_include_ignored', _filesIncludeIgnored ? '1' : '0'); } catch {}
      $tog.classList.toggle('on', _filesIncludeIgnored);
      refreshFilesView();
    });
  }
  // Filename search box: typing switches to search mode (debounced), clearing returns to Recent files. value is preserved across re-render.
  const $search = $files.querySelector('#files-search');
  const $searchWrap = $files.querySelector('#files-search-wrap');
  const $searchClear = $files.querySelector('#files-search-clear');
  if ($search) {
    $search.value = _filesQuery;
    const syncHasValue = () => $searchWrap && $searchWrap.classList.toggle('has-value', !!_filesQuery.trim());
    $search.addEventListener('input', () => {
      _filesQuery = $search.value;
      syncHasValue();
      if (_filesSearchDebounce) clearTimeout(_filesSearchDebounce);
      _filesSearchDebounce = setTimeout(refreshFilesView, 150);
    });
    // Esc: with a query, clear it first (don't bubble to the global modal-close handler); without a query, let it through → close modal
    $search.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && _filesQuery) {
        e.stopPropagation();
        _filesQuery = '';
        $search.value = '';
        syncHasValue();
        refreshFilesView();
      }
    });
  }
  if ($searchClear) {
    $searchClear.addEventListener('click', () => {
      _filesQuery = '';
      if ($search) { $search.value = ''; $search.focus(); }
      if ($searchWrap) $searchWrap.classList.remove('has-value');
      refreshFilesView();
    });
  }
  if (_filesPaths.length > 1) {
    $files.querySelectorAll('.files-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.path;
        if (p === _filesRoot) return;
        _filesRoot = p;
        renderFilesShell();   // rebuild shell (preserve _filesQuery → refill the input box)
        refreshFilesView();   // after tab switch, re-run on the new root in the current mode (search / recent)
      });
    });
  }
}

function closeFilesModal() {
  if ($files) $files.classList.remove('open');
  if (_filesPollTimer) { clearInterval(_filesPollTimer); _filesPollTimer = null; }
  if (_filesSearchDebounce) { clearTimeout(_filesSearchDebounce); _filesSearchDebounce = null; }
  _filesRoot = '';
  _filesPaths = [];
  _filesGroupName = '';
  _filesQuery = '';
}

async function fetchRecentFiles() {
  if (!_filesRoot || !$files || !$files.classList.contains('open')) return;
  const root = _filesRoot;
  try {
    let url = `/api/recent-files?root=${encodeURIComponent(root)}&limit=50`;
    if (_filesIncludeIgnored) url += '&include_ignored=1';
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (root !== _filesRoot || _filesQuery.trim()) return;  // modal switched / already in search mode
    renderFilesList(data, 'recent');
  } catch (err) {
    const body = $files && $files.querySelector('#files-body');
    if (body) {
      body.innerHTML = `<div class="files-empty">Failed: ${escapeHtml(err.message)} · <button class="files-retry" type="button">Retry</button></div>`;
      body.querySelector('.files-retry')?.addEventListener('click', refreshFilesView);
    }
  }
}

// Whole-tree fd filename search (a capability separate from Recent files, within the same modal)
async function fetchFindFiles() {
  if (!_filesRoot || !$files || !$files.classList.contains('open')) return;
  const root = _filesRoot;
  const q = _filesQuery.trim();
  if (!q) { fetchRecentFiles(); return; }
  try {
    let url = `/api/find-files?root=${encodeURIComponent(root)}&q=${encodeURIComponent(q)}&limit=300`;
    if (_filesIncludeIgnored) url += '&include_ignored=1';
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    // Guard against staleness: root switched / query changed (debounce + poll concurrency) → discard old results
    if (root !== _filesRoot || q !== _filesQuery.trim()) return;
    renderFilesList(data, 'find');
  } catch (err) {
    const body = $files && $files.querySelector('#files-body');
    if (body) {
      body.innerHTML = `<div class="files-empty">Search failed: ${escapeHtml(err.message)} · <button class="files-retry" type="button">Retry</button></div>`;
      body.querySelector('.files-retry')?.addEventListener('click', refreshFilesView);
    }
  }
}

// Backend status character → display character + class suffix
// '??' → '?' + s-Q (untracked); other single letters → literal + s-<letter>; empty → blank character
function fileStatusDisplay(status) {
  if (!status) return {label: ' ', cls: ''};
  if (status === '??') return {label: '?', cls: 's-Q'};
  return {label: status, cls: 's-' + status};
}

function renderFilesList(data, mode) {
  mode = mode || 'recent';
  const body = $files.querySelector('#files-body');
  const meta = $files.querySelector('#files-meta');
  if (meta) {
    if (mode === 'find') {
      const n = (data.matched != null) ? data.matched : (data.files ? data.files.length : 0);
      const shown = data.files ? data.files.length : 0;
      const trunc = data.truncated ? ` · showing ${shown}` : '';
      meta.innerHTML = `<span class="dot">●</span>${n} match${n === 1 ? '' : 'es'} · fd${trunc} · 5s`;
    } else if (data.git) {
      const branch = data.branch ? escapeHtml(data.branch) + ' · ' : '';
      meta.innerHTML = `<span class="dot">●</span>${branch}${data.files.length} files · git ls-files · 5s`;
    } else {
      meta.innerHTML = `<span class="dot">●</span>${data.files.length} files · walk · 5s`;
    }
  }
  if (!data.files || data.files.length === 0) {
    if (mode === 'find') {
      const msg = data.error
        ? 'fd error: ' + escapeHtml(data.error)
        : `No files match “${escapeHtml(data.query || '')}”`;
      body.innerHTML = `<div class="files-empty">${msg}</div>`;
    } else {
      body.innerHTML = `<div class="files-empty">No files found${data.error ? ': ' + escapeHtml(data.error) : ''}</div>`;
    }
    return;
  }
  body.innerHTML = data.files.map(f => {
    const rel = f.rel;
    const slash = rel.lastIndexOf('/');
    const dir = slash >= 0 ? rel.slice(0, slash + 1) : '';
    const name = slash >= 0 ? rel.slice(slash + 1) : rel;
    const iso = new Date(f.mtime * 1000).toISOString();
    const {label, cls} = fileStatusDisplay(f.status || '');
    const statusTitle = f.status ? ` · status: ${f.status}` : '';
    const statusClass = cls ? ` ${cls}` : '';
    return `
      <div class="file-row" data-file-path="${escapeHtml(f.path)}" title="${escapeHtml(f.path)}\n${escapeHtml(iso)}${escapeHtml(statusTitle)}">
        <span class="file-status${statusClass}">${escapeHtml(label)}</span>
        <span class="file-rel"><span class="file-dir">${escapeHtml(dir)}</span><span class="file-name">${escapeHtml(name)}</span></span>
        <span class="file-time">${relTime(iso)}</span>
        <span class="file-size">${formatSize(f.size)}</span>
        <span class="file-actions">
          <button class="file-action-btn" data-act="copy" data-tooltip="Copy absolute path" aria-label="Copy absolute path">${ICONS.copy}copy</button>
          <button class="file-action-btn" data-act="reveal" data-tooltip="Reveal in Finder" aria-label="Reveal in Finder">${ICONS.folder}reveal</button>
        </span>
      </div>`;
  }).join('');
  body.querySelectorAll('.file-row').forEach(row => {
    const filePath = row.dataset.filePath;
    row.querySelectorAll('.file-action-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();  // don't bubble and trigger the row's default "open file"
        const act = btn.dataset.act;
        if (act === 'copy') {
          navigator.clipboard.writeText(filePath).then(
            () => toast('Copied path'),
            () => toast('Copy failed'),
          );
        } else if (act === 'reveal') {
          revealFileInFinder(filePath);
        }
      });
    });
    row.addEventListener('click', () => openFileInSystem(filePath));
  });
}

function formatSize(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
  if (n < 1024 * 1024 * 1024) return (n / 1048576).toFixed(1) + 'M';
  return (n / 1073741824).toFixed(1) + 'G';
}
